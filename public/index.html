function parseExtrato(txt){
  const out=[];
  if(/<STMTTRN>/i.test(txt)){ txt.split(/<STMTTRN>/i).slice(1).forEach(b=>{ const g=t=>((b.match(new RegExp("<"+t+">([^<\\r\\n]*)","i"))||[])[1]||"").trim(); const d=g("DTPOSTED"), v=parseFloat(g("TRNAMT").replace(",","."));
    if(d.length>=8&&!isNaN(v)) out.push({data:`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`,valor:v,desc:g("MEMO")||g("NAME")||"Movimentação",fitid:g("FITID")}); }); return out; }
  const lines=txt.split(/\r?\n/).filter(l=>l.trim()); if(!lines.length) return out;
  const sep=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?";":",";
  for(const ln of lines){ const cs=ln.split(sep).map(c=>c.replace(/^"|"$/g,"").trim()); let data="", m;
    for(const c of cs){ if(data) break; if((m=c.match(/^(\d{2})\/(\d{2})\/(\d{4})/))) data=`${m[3]}-${m[2]}-${m[1]}`; else if((m=c.match(/^(\d{4})-(\d{2})-(\d{2})/))) data=m[0]; }
    if(!data) continue;
    const nums=cs.filter(c=>/^-?\s*(R\$\s*)?-?\s*[\d.]*\d(,\d{1,2})?\s*[CD]?$/i.test(c)&&!/^\d{2}\/\d{2}/.test(c)&&!/^\d{4}-\d{2}-\d{2}/.test(c));
    if(!nums.length) continue;
    let raw=nums[0].replace(/R\$|\s/g,""); const deb=/D$/i.test(raw); raw=raw.replace(/[CD]$/i,"");
    let valor=/,\d{1,2}$/.test(raw)?parseFloat(raw.replace(/\./g,"").replace(",",".")):parseFloat(raw); if(deb&&valor>0) valor=-valor;
    const desc=cs.filter(c=>!/^[-\d.,\/R$\s:CD]+$/i.test(c)).sort((a,b)=>b.length-a.length)[0]||"Movimentação";
    if(!isNaN(valor)) out.push({data,valor,desc}); }
  return out;
}

function pgRelTISS(){

  const by={}; ls.forEach(l=>{ const o=by[l.operadoraId]||(by[l.operadoraId]={n:0,it:0,fat:0,gl:0,rec:0,ab:0}); const g=glosaTot(l); o.n++; o.it+=l.itens.length; o.fat+=l.total; o.gl+=g; if(l.status==="pago") o.rec+=(l.recebido??l.total-g); else o.ab+=l.total-g; });
  const T={n:0,it:0,fat:0,gl:0,rec:0,ab:0}; Object.values(by).forEach(o=>{ for(const k in T) T[k]+=o[k]; });
  const pg=(g,f)=>f?(g/f*100).toFixed(1).replace(".",",")+"%":"-";
  const gl=ls.flatMap(l=>(l.glosas||[]).map(g=>({l,g,i:l.itens.find(x=>x.plantaoId===g.plantaoId)})));
  CSV_ROWS=[["Operadora","Lotes","Atendimentos","Faturado","Glosado","% glosa","Recebido","A receber"],...Object.entries(by).map(([id,o])=>[Store.get("operadoras",id)?.nome||"-",o.n,o.it,money(o.fat),money(o.gl),pg(o.gl,o.fat),money(o.rec),money(o.ab)])];
  return pageHead("Relatório TISS",`Janeiro a ${mesCap(mes)}`,mesBar()+exportBar("relatorio-tiss-"+mes))+
  `<div class="kpis"><div class="kpi"><small class="kl">Faturado no ano</small><b>${brl(T.fat)}</b></div><div class="kpi ${T.gl?"k-red":""}"><small class="kl">Glosado</small><b>${brl(T.gl)}</b><span>${pg(T.gl,T.fat)} do faturado</span></div><div class="kpi k-green"><small class="kl">Recebido</small><b>${brl(T.rec)}</b></div><div class="kpi"><small class="kl">A receber</small><b>${brl(T.ab)}</b></div></div>
  <section class="card"><h2>Por operadora</h2>${tabela(["Operadora","Lotes|r","Atendimentos|r","Faturado|r","Glosado|r","% glosa|r","Recebido|r","A receber|r"],Object.entries(by).map(([id,o])=>({cells:[`<b>${esc(Store.get("operadoras",id)?.nome||"-")}</b>`,o.n,o.it,brl(o.fat),brl(o.gl),pg(o.gl,o.fat),brl(o.rec),brl(o.ab)]})),"Nenhum lote no período.")}</section>
  <section class="card"><h2>Glosas e motivos</h2>${tabela(["Lote","Paciente","Data","Valor glosado|r","Motivo"],gl.map(({l,g,i})=>({act:"verLote",id:l.id,cells:[esc(l.numero),esc(i?.paciente||"-"),i?fmtDay(i.data):"-",brl(g.valor),esc(g.motivo)]})),"Nenhuma glosa registrada.")}</section>`;
}
/* Arquivo XML no padrão TISS (guia SP/SADT por atendimento) */
const CBO={"Enfermeiro(a)":"223505","Técnico(a) de enfermagem":"322205","Auxiliar de enfermagem":"322230","Fisioterapeuta":"223605","Fonoaudiólogo(a)":"223810","Nutricionista":"223710","Psicólogo(a)":"251510","Médico(a)":"225125","Cuidador(a)":"516210","Terapeuta ocupacional":"223905"};
const CONSELHO={CRAS:"01",COREN:"02",CRF:"03",CRFA:"04",CREFITO:"05",CRM:"06",CRN:"07",CRO:"08",CRP:"09"};
const UF_IBGE={RO:11,AC:12,AM:13,RR:14,PA:15,AP:16,TO:17,MA:21,PI:22,CE:23,RN:24,PB:25,PE:26,AL:27,SE:28,BA:29,MG:31,ES:32,RJ:33,SP:35,PR:41,SC:42,RS:43,MS:50,MT:51,GO:52,DF:53};
const xmlEsc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]));
const latin1=s=>[...String(s)].map(ch=>ch.charCodeAt(0)<256?ch:"?").join("");
function md5(s){
  const K=[],R=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  for(let i=0;i<64;i++) K[i]=Math.floor(Math.abs(Math.sin(i+1))*4294967296)|0;
  const n=s.length, nw=(((n+8)>>6)+1)*16, W=new Array(nw).fill(0);
  for(let i=0;i<n;i++) W[i>>2]|=(s.charCodeAt(i)&255)<<((i%4)*8);
  W[n>>2]|=0x80<<((n%4)*8); W[nw-2]=(n*8)>>>0; W[nw-1]=Math.floor(n/536870912)>>>0;
  let a0=0x67452301,b0=0xefcdab89|0,c0=0x98badcfe|0,d0=0x10325476;
  for(let i=0;i<nw;i+=16){ let A=a0,B=b0,C=c0,D=d0;
    for(let j=0;j<64;j++){ let F,g; if(j<16){F=(B&C)|(~B&D);g=j;} else if(j<32){F=(D&B)|(~D&C);g=(5*j+1)%16;} else if(j<48){F=B^C^D;g=(3*j+5)%16;} else {F=C^(B|~D);g=(7*j)%16;}
      const tmp=D; D=C; C=B; const x=(A+F+K[j]+W[i+g])|0; B=(B+((x<<R[j])|(x>>>(32-R[j]))))|0; A=tmp; }
    a0=(a0+A)|0; b0=(b0+B)|0; c0=(c0+C)|0; d0=(d0+D)|0; }
  return [a0,b0,c0,d0].map(v=>{ let h=""; for(let i=0;i<4;i++) h+=((v>>>(i*8))&255).toString(16).padStart(2,"0"); return h; }).join("");
}
function loteXMLStr(l){
  const op=Store.get("operadoras",l.operadoraId)||{}, c=Store.cfg(), v=op.versaoTISS||"4.01.00", now=new Date(), T=(t,x)=>`<ans:${t}>${x}</ans:${t}>`;
  const ufEmp=(c.e_uf||(c.cidade||"").split("/")[1]||"CE").trim().toUpperCase();
  const prest=T("codigoPrestadorNaOperadora",xmlEsc(op.codPrestador||""));
  const guias=l.itens.map((i,n)=>{ const [hi,hf]=String(i.horario||"").split("–"), reg=i.profRegistro||"", cons=(reg.match(/^(COREN|CREFITO|CRFA|CRM|CRN|CRP|CRF|CRO|CRAS)/i)||[])[1]?.toUpperCase()||"", ufR=(reg.match(/-([A-Z]{2})\b/i)||[])[1]?.toUpperCase()||ufEmp;
    const cbo=Object.entries(CBO).find(([k])=>norm(k).slice(0,6)===norm(i.profFuncao||"").slice(0,6))?.[1]||"";
    const hr=x=>String(x||"00:00").trim().slice(0,5)+":00";
    return T("guiaSP-SADT",T("cabecalhoGuia",T("registroANS",xmlEsc(op.registroANS||""))+T("numeroGuiaPrestador",xmlEsc(String(l.numero).replace(/\D/g,"")+String(n+1).padStart(3,"0"))))
      +T("dadosAutorizacao",T("numeroGuiaOperadora",xmlEsc(i.autorizacao||""))+T("dataAutorizacao",i.data)+T("senha",xmlEsc(i.autorizacao||"")))
      +T("dadosBeneficiario",T("numeroCarteira",xmlEsc(digits(i.carteirinha)||i.carteirinha||""))+T("atendimentoRN","N")+T("nomeBeneficiario",xmlEsc(i.paciente)))
      +T("dadosSolicitante",T("contratadoSolicitante",prest+T("nomeContratado",xmlEsc(c.nome||"")))+T("profissionalSolicitante",T("nomeProfissional",xmlEsc(i.profissional||""))+T("conselhoProfissional",CONSELHO[cons]||"10")+T("numeroConselhoProfissional",digits(reg))+T("UF",String(UF_IBGE[ufR]||""))+T("CBOS",cbo)))
      +T("dadosSolicitacao",T("caraterAtendimento","1"))
      +T("dadosExecutante",T("contratadoExecutante",prest+T("nomeContratado",xmlEsc(c.nome||"")))+T("CNES","9999999"))
      +T("dadosAtendimento",T("tipoAtendimento","06")+T("indicacaoAcidente","9")+T("regimeAtendimento","04"))
      +T("procedimentosExecutados",T("procedimentoExecutado",T("sequencialItem","1")+T("dataExecucao",i.data)+T("horaInicial",hr(hi))+T("horaFinal",hr(hf))+T("procedimento",T("codigoTabela",xmlEsc(i.tussTabela||"00"))+T("codigoProcedimento",xmlEsc(i.tussCodigo||""))+T("descricaoProcedimento",xmlEsc(String(i.tussDesc||i.procedimento).slice(0,150))))+T("quantidadeExecutada","1")+T("reducaoAcrescimo","1.00")+T("valorUnitario",(+i.valor).toFixed(2))+T("valorTotal",(+i.valor).toFixed(2))))
      +T("valorTotal",T("valorProcedimentos",(+i.valor).toFixed(2))+T("valorTotalGeral",(+i.valor).toFixed(2)))); }).join("");
  const corpo=T("cabecalho",T("identificacaoTransacao",T("tipoTransacao","ENVIO_LOTE_GUIAS")+T("sequencialTransacao",String(Date.now()).slice(-8))+T("dataRegistroTransacao",today())+T("horaRegistroTransacao",now.toTimeString().slice(0,8)))+T("origem",T("identificacaoPrestador",prest))+T("destino",T("registroANS",xmlEsc(op.registroANS||"")))+T("Padrao",v))
    +T("prestadorParaOperadora",T("loteGuias",T("numeroLote",xmlEsc(String(l.numero).replace(/\D/g,"")))+T("guiasTISS",guias)));
  const txt=corpo.replace(/<[^>]+>/g,"").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&");
  return `<?xml version="1.0" encoding="ISO-8859-1"?>\n<ans:mensagemTISS xmlns:ans="http://www.ans.gov.br/padroes/tiss/schemas" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">${corpo}${T("epilogo",T("hash",md5(latin1(txt))))}</ans:mensagemTISS>\n`;
}

const formsCfg=()=>Store.cfg().formularios||[];
function parseCampos(txt){ return txt.split("\n").map(s=>s.trim()).filter(Boolean).map((ln,i)=>{ const [l0,t0="texto",o=""]=ln.split("|").map(x=>x.trim()); const req=/\*\s*$/.test(l0)||/\*\s*$/.test(t0); const t=norm(t0.replace("*",""));

/* ---------- tarefas do plantão ---------- */
function tarefasBase(pac){
  const corta = s => String(s||"").split("\n").map(x=>x.trim()).filter(Boolean);
  return [...corta(pac.medicamentos).map(txt=>({t:"med",txt})), ...corta(pac.plano).map(txt=>({t:"cui",txt}))];
}
function tarefasHTML(p, pac, editavel){
  const base=tarefasBase(pac); if(!base.length) return "";
  const feitas=p.tarefas||{}, n=base.filter((b,i)=>feitas[b.t+i]).length;
  return `<div class="card tarefasbox" style="background:var(--surface-2)"><div class="card-h"><h3 style="margin:0">Tarefas do plantão</h3><span class="pill ${n===base.length?"p-ok":"p-warn"}">${n} de ${base.length} feitas</span></div>
    <ul class="tarefas">${base.map((b,i)=>{ const f=feitas[b.t+i];
      return `<li class="${f?"ok":""}"><label><input type="checkbox" ${f?"checked":""} ${editavel?`data-act="tarefa" data-id="${p.id}" data-v="${b.t+i}"`:"disabled"}><span>${esc(b.txt)}</span></label><small class="${f?"":"muted"}">${f?hhmm(f.em)+(f.por?" · "+esc(first(f.por)):""):(b.t==="med"?"medicação":"cuidado")}</small></li>`; }).join("")}</ul>
    ${editavel?`<p class="small muted">A lista vem dos medicamentos e do plano de cuidados do paciente. Vá marcando durante o plantão: fica registrado com a hora.</p>`:""}</div>`;
}
function materiaisHTML(p, editavel){
  const ms=p.materiais||[];

    const bd=$(".modal-b"), spec=PERFIL_SPEC(), v=readFields(spec,bd), m=missing(spec,v); if(m) return showErr(bd,m);
    v.endereco=montaEnd(v);
    await Store.put("profissionais",{...meuPro(),...v}); closeModal(); toast("Dados atualizados"); render(); },
  async trocarSenha(){
    if(Store.mode==="demo") return toast("Na demonstração a senha é 123456");
    const p=meuPro(), email=p.acesso||p.email;
    if(!email) return toast("Seu e-mail de acesso não está no cadastro. Fale com a administração.");
    try{ await Store.auth.sendPasswordResetEmail(email); toast("Enviamos o link de troca de senha para "+email); }
    catch(e){ toast("Não foi possível enviar agora."); } }
});
/* envio de documento pelo profissional */
document.addEventListener("change", async e=>{
  const input=e.target; if(!input.classList?.contains("prodoc")) return;
  const file=input.files[0]; if(!file) return;
  const k=input.dataset.doc, lbl=input.closest("label"), txt=lbl.textContent;
  lbl.textContent="Enviando...";
  try{
    const data=await prepFile(file);
    await Store.put("documentos",{id:`${S.profId}_${k}`,prof:S.profId,tipo:k,nome:file.name,data,criado:new Date().toISOString()});
    const p=meuPro(); p.docs={...(p.docs||{}),[k]:{nome:file.name,em:new Date().toISOString(),kb:Math.max(1,Math.round(data.length*0.75/1024))}};
    await Store.put("profissionais",p);
    toast(DOC_NAME[k]+" enviado"); render();
  }catch(err){ lbl.textContent=txt; input.value=""; toast(err.message||"Não foi possível enviar"); }
});

/* =================== INÍCIO =================== */
(async()=>{
  $("#root").innerHTML=`<p class="empty" style="padding-top:30vh">Carregando o sistema...</p>`;
  try{
    await Store.init();
    if(Store.mode==="demo"){ try{ S=JSON.parse(sessionStorage.getItem(SS_KEY)); }catch(e){} }
    else await new Promise(ok=>{ const off=Store.auth.onAuthStateChanged(async u=>{ off(); try{ if(u){ const d=await Store.fetchOne("usuarios",u.uid); if(d){ S={role:d.role,profId:d.profId||null,pacId:d.pacId||null,nome:d.nome||u.email}; await Store.loadFor(S); } } }catch(e){ console.error(e); S=null; try{ await Store.auth.signOut(); }catch(_){} } ok(); }); });
  }catch(err){ $("#root").innerHTML=`<p class="empty" style="padding-top:30vh">${esc(err.message)}</p>`; return; }
  render();
  if(Store.bloqueadas&&Store.bloqueadas.length) toast("Algumas áreas não carregaram por falta de permissão no banco ("+Store.bloqueadas.join(", ")+"). Atualize as regras do Firestore no console do Firebase.");
})();
try{ if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
</script>
