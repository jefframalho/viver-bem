<style>
/* Layout: sistema de gestão com barra lateral fixa (desktop) que vira gaveta no celular; telas públicas centralizadas sem barra */
:root{
  --blue:#1F648D; --blue-deep:#0F3550; --copper:#B46E43; --copper-soft:#F5E4D8;
  --bg:#F1F5F8; --surface:#FFFFFF; --surface-2:#F7FAFC; --ink:#13293A; --muted:#5A7287; --line:#D8E3EB;
  --ok:#2C7A52; --ok-bg:#E0F2E7; --warn:#93650E; --warn-bg:#FBF0D3; --bad:#A63D3D; --bad-bg:#F8E1E1; --info-bg:#E1EDF5;
  --on-blue:#FFFFFF; --side:#0F3550; --side-ink:#C9DCE8; --side-active:rgba(255,255,255,.12);
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --blue:#62A8D8; --blue-deep:#0A2230; --copper:#E3A57C; --copper-soft:#3B2A1F;
  --bg:#0B161D; --surface:#12212B; --surface-2:#0F1C25; --ink:#E3EDF3; --muted:#93AABB; --line:#23384A;
  --ok:#7DCC9F; --ok-bg:#153226; --warn:#E5C06B; --warn-bg:#382D13; --bad:#EF9B9B; --bad-bg:#3C1C1C; --info-bg:#163246;
  --on-blue:#0B161D; --side:#081A25; --side-ink:#A9C2D3; --side-active:rgba(255,255,255,.08); color-scheme:dark}}
:root[data-theme="dark"]{
  --blue:#62A8D8; --blue-deep:#0A2230; --copper:#E3A57C; --copper-soft:#3B2A1F;
  --bg:#0B161D; --surface:#12212B; --surface-2:#0F1C25; --ink:#E3EDF3; --muted:#93AABB; --line:#23384A;
  --ok:#7DCC9F; --ok-bg:#153226; --warn:#E5C06B; --warn-bg:#382D13; --bad:#EF9B9B; --bad-bg:#3C1C1C; --info-bg:#163246;
  --on-blue:#0B161D; --side:#081A25; --side-ink:#A9C2D3; --side-active:rgba(255,255,255,.08); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--side)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.45rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
a{color:var(--blue)}
.muted{color:var(--muted)} .small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}

/* casca */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:14px 10px calc(14px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;color:#fff;text-decoration:none}
.brand img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.brand img.logo-wide{width:100%;max-width:210px;height:auto;border-radius:12px;object-fit:contain;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.pub-top .brand img.logo-wide{max-width:170px}
.brand b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.08rem;line-height:1.1}
.brand small{font-size:.72rem;color:#E9B48F}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--side-ink);text-decoration:none;font-weight:600;font-size:.95rem}
.nav a svg{width:19px;height:19px;flex:none;opacity:.85}
.nav a:hover{background:var(--side-active);color:#fff}
.nav a[aria-current="page"]{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 #E9B48F}
.nav .badge{margin-left:auto;background:#E9B48F;color:#3A2210;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 7px}
.nav-sep{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#7FA0B6;padding:14px 10px 4px}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:.85rem}
.side-foot button{margin-top:8px}

}

/* componentes */

.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:inherit;display:block}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:700;white-space:nowrap}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.93rem}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.chips{display:flex;flex-wrap:wrap;gap:6px}

/* formulários */

/* escala */

.timeline{list-style:none;margin:0;padding:0}

.timeline li:not(:last-child)::after{content:"";position:absolute;left:6px;top:22px;bottom:-6px;width:2px;background:var(--line)}
.timeline b{display:block;font-weight:600}

.evo{border-left:3px solid var(--blue);padding:6px 0 6px 12px}

tfoot td{background:var(--surface-2);border-top:1px solid var(--line)}
.print-head{display:none}

.chatgrid{display:grid;gap:16px;grid-template-columns:minmax(0,260px) minmax(0,1fr)}
@media(max-width:820px){.chatgrid{grid-template-columns:1fr}}
.chatlist{padding:8px;max-height:70vh;overflow:auto}
.chatlist a{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 12px;border-radius:10px;text-decoration:none;color:inherit}
.chatlist a span.small{grid-column:1/-1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatlist a:hover{background:var(--surface-2)}
.chatlist a[aria-current="page"]{background:var(--info-bg)}
.chatlist .badge{background:var(--copper);color:#fff;border-radius:999px;font-size:.72rem;font-weight:700;padding:1px 7px;align-self:start}
.thread{display:grid;gap:10px;max-height:52vh;overflow:auto;padding:4px}
.msg{max-width:80%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.msg.me{margin-left:auto;background:var(--info-bg);border-color:transparent}
.msg p{margin:0;white-space:pre-line}
.msg small{color:var(--muted);font-size:.74rem}
.chatbox{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.chatbox textarea{flex:1}
/* --- calendário --- */
.calwrap{overflow:auto}
.cal-h,.cal{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));gap:4px;min-width:680px}
.cal-h span{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 6px}
.cd{min-height:86px;border:1px solid var(--line);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:3px;background:var(--surface)}
.cd.out{opacity:.4}
.cd.hoje{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.cd.off{background:var(--warn-bg)}
.cd .n{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cd .ind{font-size:.7rem;color:var(--warn);font-weight:700}
.cd .ev{font-size:.72rem;text-align:left;border:0;border-radius:6px;padding:3px 5px;cursor:pointer;background:var(--info-bg);color:var(--blue);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd .ev.s-realizado{background:var(--ok-bg);color:var(--ok)}
.cd .ev.s-falta{background:var(--bad-bg);color:var(--bad)}
.cd .ev.s-andamento{background:var(--copper-soft);color:var(--copper)}
/* --- frequência --- */
table.freq td,table.freq th{padding:6px 4px;text-align:center}
table.freq td:first-child,table.freq th:first-child{text-align:left;padding-left:12px;position:sticky;left:0;background:var(--surface);z-index:1}
table.freq th:first-child{background:var(--surface-2)}
table.freq th{font-size:.7rem}
table.freq .we{background:var(--surface-2)}
.fq-ok{color:var(--ok);font-weight:700}
.fq-f{color:var(--bad);font-weight:700}
.fq-v{color:var(--warn);font-weight:700}
.fq-a{color:var(--muted)}
/* --- DRE --- */
table.dre tr.tot td{border-top:1px solid var(--line);font-weight:700;background:var(--surface-2)}
table.dre tr.res td{border-top:2px solid var(--ink);font-weight:700;font-size:1.02rem}
/* --- assinatura --- */
.sigpad{position:relative;margin-top:6px}
.sigpad canvas{width:100%;max-width:520px;height:180px;border:1px dashed var(--line);border-radius:12px;background:var(--surface-2);touch-action:none;display:block}
.sigpad .btn{position:absolute;top:8px;right:8px}
@media(min-width:560px){.sigpad .btn{right:calc(100% - 512px)}}
.sigsem{display:flex;align-items:center;gap:8px;margin-top:8px}
.sigsem input{width:auto}
.sigdone{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0}
.sigdone img{height:70px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px}


/* --- app do profissional --- */
.agora{border-color:var(--copper);display:flex;flex-direction:column;gap:12px}
.agora h2{margin:8px 0 2px;font-size:1.35rem}
.atalhos{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.atalho{display:grid;gap:2px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:inherit}
.atalho:hover{border-color:var(--blue)}
.atalho svg{width:22px;height:22px;color:var(--blue);margin-bottom:4px}
.atalho b{font-size:.98rem}
.atalho span{font-size:.82rem;color:var(--muted)}
.aviso{border-left:3px solid var(--copper);background:var(--surface-2);border-radius:0 10px 10px 0;padding:10px 14px;margin-bottom:10px}
.aviso p{margin:4px 0;white-space:pre-line}
.aviso.velho{opacity:.55;border-left-color:var(--line)}
a.pacard{text-decoration:none;color:inherit;display:block}
a.pacard:hover{border-color:var(--blue)}
a.pacard h2{font-size:1.1rem;margin:0}
.tarefas{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.tarefas li{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 10px;border-radius:10px;border:1px solid transparent}
.tarefas li:hover{background:var(--surface)}
.tarefas li.ok>label span{text-decoration:line-through;color:var(--muted)}
.tarefas label{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;margin:0}
.tarefas input{width:20px;height:20px;flex:none;accent-color:var(--ok)}
.tarefas small{flex:none;font-size:.76rem;color:var(--ok);font-variant-numeric:tabular-nums}
.tarefas small.muted{color:var(--muted)}
.lista-simples{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.lista-simples li{font-size:.92rem}
</style>

const uid = (p="") => p + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2,6);
const digits = s => String(s||"").replace(/\D/g,"");
const pad = n => String(n).padStart(2,"0");
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoDay(new Date());
const addDays = (s,n) => { const d=new Date(s+"T12:00"); d.setDate(d.getDate()+n); return isoDay(d); };
const fmtDay = s => s ? new Date(s+"T12:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"}) : "-";
const fmtDayW = s => new Date(s+"T12:00").toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
const fmtDT = iso => iso ? new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "-";
const brl = v => (+v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const age = nasc => { if(!nasc) return ""; const d=new Date(nasc+"T12:00"), n=new Date(); let a=n.getFullYear()-d.getFullYear(); if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate())) a--; return a; };
const fmtCPF = c => { c=digits(c); return c.length===11 ? c.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,"$1.$2.$3-$4") : c.length===14 ? c.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,"$1.$2.$3/$4-$5") : c; };
const docLabel = c => digits(c).length===14 ? "CNPJ" : "CPF";
const first = n => String(n||"").split(" ")[0];
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
function validCNPJ(c){ c=digits(c); if(!/^\d{14}$/.test(c)||/^(\d)\1+$/.test(c)) return false;
  const dv=n=>{ let s=0,w=n-7; for(let i=0;i<n;i++){ s+=+c[i]*w--; if(w<2) w=9; } const r=s%11; return r<2?0:11-r; };
  return dv(12)===+c[12] && dv(13)===+c[13]; }
const validDoc = c => { c=digits(c); return c.length===11 ? validCPF(c) : c.length===14 ? validCNPJ(c) : false; };
function validCPF(c){ c=digits(c); if(!/^\d{11}$/.test(c)||/^(\d)\1+$/.test(c)) return false;
  for(const t of [9,10]){ let s=0; for(let i=0;i<t;i++) s+=+c[i]*(t+1-i); if(((s*10)%11)%10!==+c[t]) return false; } return true; }
function toast(t){ $(".toast")?.remove(); const d=document.createElement("div"); d.className="toast"; d.setAttribute("role","status"); d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2800); }
async function copy(t){ try{ await navigator.clipboard.writeText(t); toast("Link copiado"); }catch(e){ const i=document.createElement("textarea"); i.value=t; document.body.appendChild(i); i.select(); try{document.execCommand("copy"); toast("Link copiado");}catch(_){toast("Selecione e copie o link");} i.remove(); } }
async function sha(t){ try{ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)); return [...new Uint8Array(b)].slice(0,8).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase(); }catch(e){ return uid().toUpperCase(); } }
const wa = (tel, msg="") => { let d=digits(tel); if(d.length && !d.startsWith("55")) d="55"+d; return `https://wa.me/${d}${msg?"?text="+encodeURIComponent(msg):""}`; };
const baseURL = () => location.href.split("#")[0];

/* --- Pix (BR Code / EMV) gerado inteiramente no navegador, sem depender de banco ou gateway --- */
function crc16(s){ let crc=0xFFFF; for(let i=0;i<s.length;i++){ crc^=s.charCodeAt(i)<<8;
    for(let j=0;j<8;j++){ crc = (crc&0x8000) ? ((crc<<1)^0x1021) : (crc<<1); crc&=0xFFFF; } }
  return crc.toString(16).toUpperCase().padStart(4,"0"); }
function pixTLV(id,v){ return id+String(v.length).padStart(2,"0")+v; }
function pixSemAcento(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9 ]/g," ").replace(/\s+/g," ").trim(); }
function pixPayload({chave, nome, cidade, valor, txid}){
  const mai = pixTLV("00","br.gov.bcb.pix") + pixTLV("01",String(chave||"").trim());
  let p = pixTLV("00","01") + pixTLV("01","12") + pixTLV("26",mai) + pixTLV("52","0000") + pixTLV("53","986");
  if(valor>0) p += pixTLV("54",(+valor).toFixed(2));
  p += pixTLV("58","BR") + pixTLV("59",(pixSemAcento(nome)||"VIVER BEM").slice(0,25).toUpperCase())
     + pixTLV("60",(pixSemAcento(cidade)||"BRASIL").slice(0,15).toUpperCase())
     + pixTLV("62",pixTLV("05",(txid||"***").replace(/[^A-Za-z0-9]/g,"").slice(0,25)||"***"));
  p += "6304";
  return p + crc16(p);
}
let pixLibCarregada=false;
function carregaPixLib(cb){
  if(pixLibCarregada || window.QRCode) { pixLibCarregada=true; return cb(); }
  const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js";
  s.onload=()=>{ pixLibCarregada=true; cb(); };
  s.onerror=()=>toast("Não consegui carregar o gerador de QR Code (sem internet?)");
  document.head.appendChild(s);
}
function pixModal(valor, descricao, txid){
  const c=Store.cfg();
  if(!c.pixChave) return toast("Cadastre a chave Pix da empresa em Configurações › Teleconsulta e pagamento");
  const payload=pixPayload({chave:c.pixChave, nome:c.nome, cidade:(c.cidade||"").split("/")[0], valor, txid});
  modal("Cobrar por Pix", `<p class="muted">${esc(descricao||"")}</p><p style="font-size:1.4rem;font-weight:700">${brl(valor)}</p>
    <div id="pixQrBox" style="display:flex;justify-content:center;padding:10px"><span class="muted small">Gerando QR Code…</span></div>
    <label class="f full">Pix copia e cola<textarea readonly rows="3" style="font-family:ui-monospace,monospace;font-size:.8rem" onclick="this.select()">${esc(payload)}</textarea></label>
    <div class="actions"><button class="btn btn-primary" data-act="copy" data-v="${esc(payload)}">Copiar código</button></div>`,{nofocus:1});
  carregaPixLib(()=>{ const box=$("#pixQrBox"); if(!box) return; box.innerHTML="";
    const cv=document.createElement("canvas"); box.appendChild(cv);
    window.QRCode.toCanvas(cv, payload, {width:220, margin:1}, err=>{ if(err) box.innerHTML=`<p class="err">Não consegui desenhar o QR Code</p>`; });
  });
}

function calcPag(p){
  const base=+p.valorPago||0, pro=Store.get("profissionais",p.profId), r={base,valor:base,horas:null,obs:""};
  if(p.chegada&&p.saida){ const tol=(+(Store.cfg().tolerancia??15)||0)*6e4, a=new Date(p.chegada.em).getTime(), b=new Date(p.saida.em).getTime();
    const ini = a<=tStart(p)+tol ? tStart(p) : a, fimR = b>=tEnd(p)-tol ? tEnd(p) : b;
    r.horas=Math.max(0,Math.min(p.horas,(fimR-ini)/36e5)); }
  if(p.status!=="realizado") { r.valor = p.status==="falta"?0:base; if(p.status==="falta") r.obs="Falta"; return r; }
  if(p.valorAjustado!=null&&p.valorAjustado!==""){ r.valor=+p.valorAjustado; r.obs="Ajustado: "+(p.ajusteMotivo||"pela administração"); return r; }
  if(pro?.porHora==="sim"){
    if(r.horas==null){ r.obs="Sem registro de saída, valor cheio até ajuste"; return r; }
    r.valor=Math.round(base*r.horas/p.horas*100)/100; if(r.valor<base) r.obs=`Por hora: ${r.horas.toFixed(1).replace(".",",")} h de ${p.horas} h`; }
  return r;
}

function field(f, v){
  const id="f_"+f.k, cls="f"+(f.full?" full":"");
  const lab=`${esc(f.l)}${f.req?' <i class="req">*</i>':""}${f.h?`<small>${esc(f.h)}</small>`:""}`;
  if(f.t==="checks") return `<div class="${cls}"><span>${lab}</span><div class="checks">${f.o.map(o=>`<label><input type="checkbox" name="${id}" value="${esc(o)}" ${(v||[]).includes(o)?"checked":""}>${esc(o)}</label>`).join("")}</div></div>`;
  let input;
  if(f.t==="select") input=`<select id="${id}">${f.o.map(o=>{const [val,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(v??f.d??"")===String(val)?"selected":""}>${esc(l)}</option>`}).join("")}</select>`;
  else if(f.t==="textarea") input=`<textarea id="${id}" rows="${f.rows||3}" ${f.ph?`placeholder="${esc(f.ph)}"`:""}>${esc(v??"")}</textarea>`;
  else input=`<input id="${id}" type="${f.t||"text"}" value="${esc(v??f.d??"")}" ${f.ph?`placeholder="${esc(f.ph)}"`:""} ${f.im?`inputmode="${f.im}"`:""} ${f.step?`step="${f.step}"`:""} ${f.ac?`autocomplete="${f.ac}"`:""}>`;
  return `<label class="${cls}">${lab}${input}</label>`;
}
const fields = (spec,obj={}) => `<div class="fgrid">${spec.map(f=>field(f,obj[f.k])).join("")}</div>`;
function readFields(spec, root=document){ const o={}; for(const f of spec){ if(f.t==="checks") o[f.k]=$$(`input[name="f_${f.k}"]:checked`,root).map(i=>i.value); else { const el=$("#f_"+f.k,root); const v=el?el.value.trim():""; o[f.k]= f.t==="number" ? (v===""?"":+v) : v; } } return o; }
const missing = (spec,o) => { const f=spec.find(f=>f.req && (Array.isArray(o[f.k])?!o[f.k].length:o[f.k]===""||o[f.k]==null)); return f?`Preencha o campo "${f.l}".`:""; };
function showErr(root,msg){ let e=$(".err",root); if(!e){ e=document.createElement("p"); e.className="err"; root.appendChild(e); } e.textContent=msg; e.hidden=!msg; if(msg) e.scrollIntoView({block:"nearest"}); }

function modal(title, body, opts={}){

}

async function render(){
  const {r,id} = route();
  const root = $("#root");
  if(PUBLIC[r]){ root.innerHTML = pubShell(await PUBLIC[r](id)); bindPublic(r,id); return; }
  if(!S){ root.innerHTML = pgLogin(); bindLogin(); return; }
  const table = {admin:ADMIN, prof:PROF, paciente:FAM}[S.role] || PROF;
  const def = {admin:"painel", prof:"meus", paciente:"inicio"}[S.role] || "meus";
  const fn = table[r] || table[def];
  const cur = table[r] ? r : def;
  root.innerHTML = appShell(cur, fn(id));
  if(cur==="perfil") carregaContrato();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", render);

function appShell(cur, body){
  const c = counts();
  const badge = {escala:c.semPro, recrutamento:c.cand, solicitacoes:c.sol, contratos:c.ctPend, estoque:c.estBaixo, monitoramento:c.alertas, teleconsultas:c.teleSol, chat:c.msgs, mensagens:c.msgsProf, disponiveis:c.livres, perfil:c.docsFalta, conferencia:c.venc, "financeiro-despesas":c.despVenc};
  const navItems = S.role==="admin" ? ADMIN_NAV : S.role==="paciente" ? FAM_NAV : PROF_NAV;
  const hash = decodeURIComponent(location.hash.slice(1));
  const chaves = navItems.flatMap(n => n[0]==="grp" ? n[3].map(x=>x[0]) : [n[0]]);
  const activeKey = {paciente:"pacientes",profissional:"profissionais",candidato:"recrutamento"}[cur] || cur;
  const atual = chaves.includes(hash) ? hash : activeKey;
  const link = ([k,l]) => `<a href="#${k}" ${atual===k?'aria-current="page"':""}>${ICON[k]||ICON[k.split("-")[0]]||ICON.escala}<span>${l}</span>${badge[k]?`<span class="badge">${badge[k]}</span>`:""}</a>`;
  const nav = navItems.map(n => {
    if(n[0]==="sep") return `<div class="nav-sep">${n[1]}</div>`;
    if(n[0]!=="grp") return link(n);
    const [,l,ic,subs] = n, aberto = subs.some(x=>x[0]===atual), bg = subs.reduce((a,x)=>a+(badge[x[0]]||0),0);
    return `<details class="nav-grp" ${aberto?"open":""}><summary>${ICON[ic]||ICON.escala}<span>${l}</span>${bg&&!aberto?`<span class="badge">${bg}</span>`:""}</summary>${subs.map(link).join("")}</details>`;
  }).join("");
  return `<div class="shell" id="shell">
    <header class="topbar"><button data-act="menu" aria-label="Abrir menu">${ICON.menu} Menu</button><b>Viver Bem</b></header>
    <aside class="side" aria-label="Menu">
      <a class="brand" href="#"><img class="logo-wide" src="${LOGO}" alt="Viver Bem Atendimento Domiciliar"></a>
      ${S.role==="admin"?`<form class="busca-side" id="fBusca" role="search"><input id="buscaGeral" type="search" placeholder="Buscar paciente, profissional..." value="${esc(buscaTxt)}" aria-label="Busca geral"></form>`:""}
      <nav class="nav">${nav}</nav>
      <div class="side-foot"><div>${esc(S.nome)}</div><div class="small" style="color:#7FA0B6">${{admin:"Administração",prof:"Profissional",paciente:"Paciente e família"}[S.role]}${Store.mode==="demo"?" · demonstração":""}</div>
      ${botaoInstalar("btn-sm btn-ghost-light")}
      <button class="btn btn-sm btn-ghost-light" data-act="logout">Sair</button></div>
    </aside>
    <main class="main"><div class="main-in">${body}</div></main>
  </div>`;
}

let pedidoInstalacao;
const appInstalado = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
window.addEventListener("beforeinstallprompt", e => {

function bindLogin(){
  const f=$("#fLogin"); if(!f) return;
  f.onsubmit=async e=>{ e.preventDefault(); const email=$("#lg_email").value.trim().toLowerCase(), senha=$("#lg_pass").value;
    if(!email||!senha) return showErr(f,"Digite e-mail e senha.");
    if(Store.mode==="demo"){
      const fam=Store.all("pacientes").find(x=>(x.acessoFamilia||"").toLowerCase()===email);
      if(email==="admin@viverbem.com"&&senha==="123456"){ S={role:"admin",nome:"Administração Viver Bem"}; }
      else if(fam){ if((fam.senhaDemo||"123456")!==senha) return showErr(f,"E-mail ou senha incorretos."); S={role:"paciente",pacId:fam.id,nome:(fam.responsavel||fam.nome).replace(/\s*\(.*\)/,"")}; }
      else { const p=Store.all("profissionais").find(x=>(x.acesso||"").toLowerCase()===email); if(!p||(p.senhaDemo||"123456")!==senha) return showErr(f,"E-mail ou senha incorretos."); if(p.status!=="ativo") return showErr(f,"Seu acesso está desativado. Fale com a administração."); S={role:"prof",profId:p.id,nome:p.nome}; }
      saveSession(); location.hash={admin:"painel",prof:"meus",paciente:"inicio"}[S.role]; return render();
    }
    const b=$("button.btn-primary",f); b.disabled=true;
    try{ await login(email, senha); saveSession(); location.hash={admin:"painel",prof:"meus",paciente:"inicio"}[S.role]||""; render(); }
    catch(err){ showErr(f, /password|credential|user/i.test(err.code||"")?"E-mail ou senha incorretos.":err.message); b.disabled=false; } };

function statusDia(p){ if(p.status==="realizado") return "concluido"; if(p.status==="andamento") return "andamento"; if(p.status==="falta") return "falta";
  return Date.now()>tStart(p)+15*6e4 ? "atrasado" : "nao"; }
const ST_DIA = {nao:["Não iniciados","var(--blue)"],atrasado:["Atrasados","var(--bad)"],andamento:["Em andamento","var(--copper)"],concluido:["Concluídos","var(--ok)"],falta:["Faltas","var(--muted)"]};
function donut(parts, centro, legenda){
  const tot=parts.reduce((a,x)=>a+x.v,0), R=52, C=2*Math.PI*R; let off=0;
  const segs = tot ? parts.filter(x=>x.v>0).map(x=>{ const len=C*x.v/tot; const el=`<circle r="${R}" cx="70" cy="70" fill="none" style="stroke:${x.c}" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"/>`; off+=len; return el; }).join("") : "";
  return `<svg viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="${esc(legenda)}"><circle r="${R}" cx="70" cy="70" fill="none" style="stroke:var(--line)" stroke-width="18"/>${segs}<text x="70" y="70" text-anchor="middle" style="fill:var(--ink);font:500 18px var(--f-display)">${centro}</text><text x="70" y="88" text-anchor="middle" style="fill:var(--muted);font:10px var(--f-body)">${legenda}</text></svg>`;
}

function shiftRow(p){
  const pac=Store.get("pacientes",p.pacId), at=atrasoMin(p), ch=regInfo(p.chegada,pac);
  let pill = `<span class="pill ${PL_ST[p.status][1]}">${PL_ST[p.status][0]}</span>`;
  if(p.status==="realizado"&&!p.evolucao) pill='<span class="pill p-warn">Sem evolução</span>';
  else if(p.status==="realizado"&&p.chegada&&!p.saida) pill='<span class="pill p-warn">Sem saída</span>';
  else if(p.status==="agendado"&&tStart(p)<Date.now()-30*6e4) pill='<span class="pill p-bad">Não chegou</span>';
  const pres = p.chegada ? ` · chegou ${ch.hora}${p.saida?", saiu "+hhmm(p.saida.em):""}${at>15?` <b style="color:var(--warn);display:inline">(atraso ${at} min)</b>`:""}${ch.longe?` <b style="color:var(--bad);display:inline">fora do endereço</b>`:""}` : "";
  return `<button class="shift s-${p.status} ${!p.profId&&p.status==="agendado"?"nopro":""}" data-act="plantao" data-id="${p.id}">
    <span class="t">${p.inicio} – ${fim(p)}<small>${MOD_NAME[p.mod]}${p.mod==="hora"?" · "+p.horas+"h":""}</small></span>
    <span class="w"><b>${esc(pac?.nome||"Paciente removido")}</b><span>${p.profId?esc(proName(p.profId)):'<b style="color:var(--copper);display:inline">Sem profissional</b>'}${pac?" · "+esc(loc(pac)):""}${pres}</span></span>
    <span>${pill}</span></button>`;
}

  const cus=pls.reduce((s,p)=>s+valorProf(p),0), pag=pls.filter(p=>p.pago).reduce((s,p)=>s+valorProf(p),0);
  const byPag={}; pls.forEach(p=>{ const pac=Store.get("pacientes",p.pacId); const key=pac?.tipo==="operadora"&&pac.operadoraId?"op:"+pac.operadoraId:"pac:"+p.pacId; (byPag[key]=byPag[key]||[]).push(p); });

  const rowsP=Object.entries(byPro).map(([id,l])=>{ const pro=Store.get("profissionais",id); const tot=l.reduce((s,p)=>s+valorProf(p),0), pend=l.filter(p=>!p.pago).reduce((s,p)=>s+valorProf(p),0);

/* =================== FOLHA DE PAGAMENTO =================== */
let folhaMes=null;
const mesLabel = m => { const [y,mm]=m.split("-").map(Number); return new Date(y,mm-1,15).toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); };
const folhaPlantoes = (profId, mes) => Store.all("plantoes").filter(p=>p.profId===profId&&p.data.startsWith(mes)&&["realizado","falta"].includes(p.status)).sort((a,b)=>tStart(a)-tStart(b));
function folhaResumo(profId, mes){ const l=folhaPlantoes(profId,mes), r=l.filter(p=>p.status==="realizado");
  const cs=r.map(calcPag); return {l, n:r.length, faltas:l.length-r.length, bruto:cs.reduce((s,c)=>s+c.base,0), liquido:cs.reduce((s,c)=>s+c.valor,0), pago:r.filter(p=>p.pago).reduce((s,p)=>s+valorProf(p),0),
    hPrev:r.reduce((s,p)=>s+p.horas,0), hReg:cs.reduce((s,c)=>s+(c.horas??0),0), pend:r.filter(p=>!p.pago).length, adi:Store.all("adiantamentos").filter(a=>a.profId===profId&&a.mesDesconto===mes).reduce((s,a)=>s+(+a.valor||0),0)}; }
function folhaTabela(profId, mes, admin){
  const R=folhaResumo(profId,mes), pro=Store.get("profissionais",profId);
  if(!R.l.length) return `<p class="empty">Nenhum plantão realizado em ${mesLabel(mes)}.</p>`;
  const rows=R.l.map(p=>{ const c=calcPag(p), ch=p.chegada?hhmm(p.chegada.em):"-", sa=p.saida?hhmm(p.saida.em):"-";
    return `<tr><td class="num">${fmtDay(p.data).slice(0,5)}</td><td>${esc(pacName(p.pacId))}<div class="small muted">${MOD_NAME[p.mod]}</div></td><td class="num">${p.inicio}–${fim(p)}</td><td class="num">${ch} → ${sa}</td><td class="r">${c.horas!=null?c.horas.toFixed(1).replace(".",","):"-"}</td><td class="r">${brl(c.base)}</td><td class="r"><b>${brl(c.valor)}</b>${c.obs?`<div class="small muted">${esc(c.obs)}</div>`:""}</td><td>${p.status==="falta"?'<span class="pill p-bad">Falta</span>':p.pago?'<span class="pill p-ok">Pago</span>':'<span class="pill p-warn">A receber</span>'}${admin&&p.status==="realizado"?` <a href="#" class="small" data-act="ajustarValor" data-id="${p.id}">ajustar</a>`:""}</td></tr>`; }).join("");
  return `${pro?.porHora==="sim"?`<p class="note small">Pagamento computado por hora: atrasos e saídas antes do fim do plantão são descontados (tolerância de ${+(Store.cfg().tolerancia??15)} min).</p>`:""}
  <div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Data</th><th>Paciente</th><th>Previsto</th><th>Chegada → saída</th><th class="r">Horas</th><th class="r">Plantão</th><th class="r">A receber</th><th>Situação</th></tr></thead><tbody>${rows}</tbody>
  <tfoot><tr><td colspan="4"><b>Total do mês</b> · ${R.n} plantões${R.faltas?` · ${R.faltas} falta(s)`:""}</td><td class="r"><b>${R.hReg.toFixed(1).replace(".",",")}</b></td><td class="r">${brl(R.bruto)}</td><td class="r"><b>${brl(R.liquido)}</b></td><td></td></tr></tfoot></table></div>`;
}
function pgFolha(){
  folhaMes=curMes();
  const pros=Store.all("profissionais").map(p=>({p,R:folhaResumo(p.id,folhaMes)})).filter(x=>x.R.l.length).sort((a,b)=>a.p.nome.localeCompare(b.p.nome));
  const tot=pros.reduce((s,x)=>s+x.R.liquido,0), pago=pros.reduce((s,x)=>s+x.R.pago,0), desc=pros.reduce((s,x)=>s+(x.R.bruto-x.R.liquido),0);
  return `<div class="pagehead"><div><h1>Folha de pagamento</h1><p class="sub">${mesCap(folhaMes)} · pagamento até o dia ${esc(Store.cfg().diaPagamento||"10")} do mês seguinte</p></div>
    <div class="actions"><button class="btn btn-line btn-sm" data-act="folhaMes" data-id="-1">‹ Mês anterior</button><button class="btn btn-line btn-sm" data-act="folhaMes" data-id="1">Próximo mês ›</button></div></div>
  <div class="kpis"><div class="kpi"><b>${brl(tot)}</b><span>Total da folha</span></div><div class="kpi"><b>${brl(tot-pago)}</b><span>A pagar</span></div><div class="kpi"><b>${brl(desc)}</b><span>Descontos por hora</span></div><div class="kpi"><b>${brl(pros.reduce((s,x)=>s+x.R.adi,0))}</b><span>Adiantamentos a descontar</span></div><div class="kpi"><b>${pros.length}</b><span>Profissionais com plantão</span></div></div>
  <div class="tablewrap"><table><thead><tr><th>Profissional</th><th class="r">Plantões</th><th class="r">Horas previstas</th><th class="r">Horas registradas</th><th class="r">Bruto</th><th class="r">A receber</th><th></th></tr></thead><tbody>
  ${pros.map(({p,R})=>`<tr><td><b>${esc(p.nome)}</b>${p.porHora==="sim"?' <span class="pill p-cop">Por hora</span>':""}<div class="small muted">${esc(p.funcao)}${p.pix?" · Pix "+esc(p.pix):""}</div></td><td class="r">${R.n}${R.faltas?`<div class="small" style="color:var(--bad)">${R.faltas} falta(s)</div>`:""}</td><td class="r">${R.hPrev}</td><td class="r">${R.hReg.toFixed(1).replace(".",",")}</td><td class="r">${brl(R.bruto)}</td><td class="r"><b>${brl(R.liquido)}</b></td><td class="r"><div class="actions" style="justify-content:flex-end"><button class="btn btn-sm btn-line" data-act="verFolha" data-id="${p.id}">Ver folha</button>${R.pend?`<button class="btn btn-sm btn-primary" data-act="folhaPag" data-id="${p.id}">Marcar pago</button>`:'<span class="pill p-ok">Pago</span>'}</div></td></tr>`).join("")||`<tr><td colspan="7" class="empty">Nenhum plantão realizado neste mês.</td></tr>`}
  </tbody></table></div>
  <p class="small muted">Para computar por hora, abra o cadastro do profissional e escolha "Computar por hora registrada". Valores podem ser ajustados plantão a plantão, com motivo.</p>`;
}

  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"})); a.download=nome+".csv"; document.body.appendChild(a); a.click(); a.remove(); }

/* =================== BUSCA GERAL =================== */
let buscaTxt="";
function pgBusca(){
  const q=norm(buscaTxt);
  if(q.length<2) return `<div class="pagehead"><div><h1>Busca</h1><p class="sub">Digite pelo menos 2 letras na busca do menu.</p></div></div>`;
  const has=(...v)=>norm(v.join(" ")).includes(q)||digits(v.join(" ")).includes(digits(buscaTxt))&&digits(buscaTxt).length>=4;
  const grupos=[
    ["Pacientes", Store.all("pacientes").filter(p=>has(p.nome,p.responsavel,p.cidade,p.cpf,p.telResp,p.carteirinha)).map(p=>[`#paciente-${p.id}`,p.nome||p.responsavel,`${loc(p)} · ${PAC_ST[p.status]?.[0]||""}`])],
    ["Profissionais", Store.all("profissionais").filter(p=>has(p.nome,p.funcao,p.registro,p.cpf,p.tel)).map(p=>[`#profissional-${p.id}`,p.nome,`${p.funcao} · ${p.registro||""}`])],
    ["Candidatos", Store.all("candidatos").filter(c=>has(c.nome,c.funcao,c.id,c.cpf,c.tel)).map(c=>[`#candidato-${c.id}`,c.nome,`${c.funcao} · ${CAND_NAME[candStatus(c)]}`])],
    ["Operadoras", Store.all("operadoras").filter(o=>has(o.nome,o.cnpj,o.contato)).map(o=>["#operadoras",o.nome,OP_ST[o.status]?.[0]||""])],
    ["Produtos do estoque", Store.all("produtos").filter(x=>has(x.nome,x.categoria)).map(x=>["#estoque",x.nome,`Saldo ${saldo(x.id)} ${x.unidade||""}`])]
  ].filter(g=>g[1].length);
  return `<div class="pagehead"><div><h1>Busca</h1><p class="sub">Resultados para "${esc(buscaTxt)}"</p></div></div>
  ${grupos.length?grupos.map(([t,l])=>`<section class="card"><h2>${t} · ${l.length}</h2><div class="list-links">${l.slice(0,30).map(([h,a,b])=>`<a href="${h}"><b>${esc(a)}</b><span>${esc(b)}</span></a>`).join("")}</div></section>`).join(""):`<p class="empty">Nada encontrado.</p>`}`;
}

/* =================== FATURAMENTO DE CONVÊNIOS =================== */
let fatMes=null;
const LOTE_ST={aberto:["Em aberto","p-blue"],enviado:["Enviado à operadora","p-warn"],pago:["Pago","p-ok"]};
function itensFaturaveis(opId, mes){ const usados=new Set(Store.all("lotes").flatMap(l=>l.itens.map(i=>i.plantaoId)));
  return Store.all("plantoes").filter(p=>p.status==="realizado"&&p.data.startsWith(mes)&&Store.get("pacientes",p.pacId)?.operadoraId===opId&&!usados.has(p.id)).sort((a,b)=>tStart(a)-tStart(b)); }
const glosaTot = l => (l.glosas||[]).reduce((a,g)=>a+(+g.valor||0),0);
function pgFatLotes(){
  fatMes=curMes();
  const ops=Store.all("operadoras").filter(o=>o.status!=="inativa");
  const lotes=Store.all("lotes").slice().sort((a,b)=>b.criado.localeCompare(a.criado));
  const aberto=lotes.filter(l=>l.status!=="pago").reduce((a,l)=>a+l.total-glosaTot(l),0), glos=lotes.reduce((a,l)=>a+glosaTot(l),0);
  return `<div class="pagehead"><div><h1>Faturamento de convênios</h1><p class="sub">${mesCap(fatMes)} · atendimentos de pacientes de operadoras, agrupados em lotes</p></div>
    <div class="actions"><button class="btn btn-line btn-sm" data-act="fatMes" data-id="-1">‹ Mês anterior</button><button class="btn btn-line btn-sm" data-act="fatMes" data-id="1">Próximo mês ›</button></div></div>
  <div class="kpis"><div class="kpi"><b>${brl(aberto)}</b><span>A receber das operadoras</span></div><div class="kpi"><b>${brl(glos)}</b><span>Glosas registradas</span></div><div class="kpi"><b>${lotes.filter(l=>l.status==="enviado").length}</b><span>Lotes enviados aguardando</span></div></div>
  <section class="card"><h2>Prontos para faturar</h2><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Operadora</th><th class="r">Atendimentos</th><th class="r">Valor</th><th></th></tr></thead><tbody>
    ${ops.map(o=>{ const it=itensFaturaveis(o.id,fatMes); return `<tr><td><b>${esc(o.nome)}</b>${ex(o)}</td><td class="r">${it.length}</td><td class="r">${brl(it.reduce((a,p)=>a+(+p.valorCobrado||0),0))}</td><td class="r">${it.length?`<button class="btn btn-sm btn-primary" data-act="gerarLote" data-id="${o.id}">Gerar lote</button>`:'<span class="small muted">Nada pendente</span>'}</td></tr>`; }).join("")||`<tr><td colspan="4" class="empty">Cadastre as operadoras credenciadas.</td></tr>`}</tbody></table></div></section>
  <section class="card"><h2>Lotes</h2><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Lote</th><th>Operadora</th><th>Competência</th><th class="r">Valor</th><th class="r">Glosas</th><th>Situação</th></tr></thead><tbody>
    ${lotes.map(l=>`<tr class="click" data-act="verLote" data-id="${l.id}"><td><b>${esc(l.numero)}</b>${ex(l)}</td><td>${esc(Store.get("operadoras",l.operadoraId)?.nome||"-")}</td><td>${mesCap(l.mes)}</td><td class="r">${brl(l.total)}</td><td class="r">${glosaTot(l)?brl(glosaTot(l)):"-"}</td><td><span class="pill ${LOTE_ST[l.status][1]}">${LOTE_ST[l.status][0]}</span></td></tr>`).join("")||`<tr><td colspan="6" class="empty">Nenhum lote gerado.</td></tr>`}</tbody></table></div></section>
  <p class="small muted">O lote reúne os atendimentos com número da carteirinha, data, procedimento e valor, pronto para conferência e envio. O arquivo XML no padrão TISS da ANS pode ser adicionado quando a operadora informar a versão e a tabela de códigos (TUSS) exigidas.</p>`;
}
function loteView(id){
  const l=Store.get("lotes",id), op=Store.get("operadoras",l.operadoraId);
  CSV_ROWS=[["Lote","Operadora","Paciente","Carteirinha","Data","Procedimento","Horário","Profissional","Valor","Glosa","Motivo da glosa"],
    ...l.itens.map(i=>{ const g=(l.glosas||[]).find(x=>x.plantaoId===i.plantaoId); return [l.numero,op?.nome,i.paciente,i.carteirinha,fmtDay(i.data),i.procedimento,i.horario,i.profissional,(+i.valor).toFixed(2).replace(".",","),g?(+g.valor).toFixed(2).replace(".",","):"",g?.motivo||""]; })];
  modal(`Lote ${l.numero}`, `<p class="muted">${esc(op?.nome||"")} · ${mesCap(l.mes)} · <span class="pill ${LOTE_ST[l.status][1]}">${LOTE_ST[l.status][0]}</span>${l.protocolo?` · protocolo ${esc(l.protocolo)}`:""}</p>
    <div class="tablewrap"><table><thead><tr><th>Paciente</th><th>Carteirinha</th><th>Data</th><th>Procedimento</th><th class="r">Valor</th><th>Glosa</th></tr></thead><tbody>
    ${l.itens.map(i=>{ const g=(l.glosas||[]).find(x=>x.plantaoId===i.plantaoId); return `<tr><td>${esc(i.paciente)}</td><td>${esc(i.carteirinha||"-")}</td><td class="num">${fmtDay(i.data)} ${esc(i.horario)}</td><td>${esc(i.procedimento)}</td><td class="r">${brl(i.valor)}</td><td>${g?`<span class="pill p-bad">${brl(g.valor)}</span> <span class="small muted">${esc(g.motivo)}</span>`:l.status!=="pago"?`<a href="#" class="small" data-act="glosa" data-id="${l.id}" data-v="${i.plantaoId}">registrar</a>`:"-"}</td></tr>`; }).join("")}</tbody>
    <tfoot><tr><td colspan="4"><b>Total</b> · ${l.itens.length} atendimentos</td><td class="r"><b>${brl(l.total)}</b></td><td>${glosaTot(l)?`Líquido ${brl(l.total-glosaTot(l))}`:""}</td></tr></tfoot></table></div>
    <div class="actions">${l.status==="aberto"?`<button class="btn btn-primary" data-act="loteEnviado" data-id="${l.id}">Marcar como enviado</button>`:""}${l.status!=="pago"?`<button class="btn btn-copper" data-act="lotePago" data-id="${l.id}">Registrar pagamento</button>`:""}${exportBar("lote-"+l.numero)}${l.status==="aberto"?`<button class="btn btn-danger" data-act="delLote" data-id="${l.id}">Excluir lote</button>`:""}</div>`,{wide:1,nofocus:1});
}

/* =================== RELATÓRIOS =================== */
let rel={tipo:"atendimentos",de:null,ate:null,pac:"",pro:""};
const REL_TIPOS=[["atendimentos","Atendimentos por período"],["presenca","Presença e pontualidade"],["produtividade","Produtividade por profissional"],["pacientes","Resumo por paciente"],["prontuario","Prontuário (evoluções do paciente)"],["estoque","Consumo de materiais"],["financeiro","Financeiro por mês"],["teleconsultas","Teleconsultas"],["monitoramento","Monitoramento de crônicos"],["intercorrencias","Intercorrências"]];
function pgRelatorios(){
  if(!rel.de){ rel.de=today().slice(0,8)+"01"; rel.ate=today(); }
  const pls=Store.all("plantoes").filter(p=>p.data>=rel.de&&p.data<=rel.ate&&(!rel.pac||p.pacId===rel.pac)&&(!rel.pro||p.profId===rel.pro)).sort((a,b)=>tStart(a)-tStart(b));
  let head=[], rows=[], foot=null, nota="";
  const h1=n=>n.toFixed(1).replace(".",",");
  if(rel.tipo==="atendimentos"){ head=["Data","Horário","Paciente","Profissional","Modalidade","Situação","Chegada","Saída","Valor cobrado"];
    rows=pls.map(p=>[fmtDay(p.data),`${p.inicio}–${fim(p)}`,pacName(p.pacId),proName(p.profId),MOD_NAME[p.mod],PL_ST[p.status][0],p.chegada?hhmm(p.chegada.em):"-",p.saida?hhmm(p.saida.em):"-",brl(p.valorCobrado)]);
    foot=["Total",`${pls.length} atendimentos`,"","","","","","",brl(pls.filter(p=>p.status!=="cancelado").reduce((a,p)=>a+(+p.valorCobrado||0),0))]; }
  if(rel.tipo==="presenca"||rel.tipo==="produtividade"){
    const by={}; pls.filter(p=>p.profId&&p.status!=="cancelado"&&tStart(p)<Date.now()).forEach(p=>(by[p.profId]=by[p.profId]||[]).push(p));
    if(rel.tipo==="presenca"){ head=["Profissional","Plantões","Com chegada","Atrasos (>15 min)","Atraso médio","Fora do endereço","Sem saída","Faltas","Lançados pela adm."];
      rows=Object.entries(by).map(([id,l])=>{ const ch=l.filter(p=>p.chegada), at=ch.map(atrasoMin).filter(x=>x>15), fora=l.filter(p=>regInfo(p.chegada,Store.get("pacientes",p.pacId))?.longe||regInfo(p.saida,Store.get("pacientes",p.pacId))?.longe).length;
        return [proName(id),l.length,ch.length,at.length,at.length?Math.round(at.reduce((a,x)=>a+x,0)/at.length)+" min":"-",fora,l.filter(p=>p.chegada&&!p.saida&&p.status==="realizado").length,l.filter(p=>p.status==="falta").length,l.filter(p=>p.chegada?.manual||p.saida?.manual).length]; }); }
    else { head=["Profissional","Função","Plantões realizados","Horas previstas","Horas registradas","Valor a pagar","Faltas"];
      rows=Object.entries(by).map(([id,l])=>{ const r=l.filter(p=>p.status==="realizado"), cs=r.map(calcPag); return [proName(id),Store.get("profissionais",id)?.funcao||"",r.length,r.reduce((a,p)=>a+p.horas,0),h1(cs.reduce((a,c)=>a+(c.horas??0),0)),brl(cs.reduce((a,c)=>a+c.valor,0)),l.filter(p=>p.status==="falta").length]; }); } }
  if(rel.tipo==="pacientes"){ head=["Paciente","Atendimento","Plantões realizados","Horas","Evoluções","Faltas","Faturado"];
    const by={}; pls.forEach(p=>(by[p.pacId]=by[p.pacId]||[]).push(p));
    rows=Object.entries(by).map(([id,l])=>{ const pac=Store.get("pacientes",id), r=l.filter(p=>p.status==="realizado"); return [pacName(id),pac?.tipo==="operadora"?(Store.get("operadoras",pac.operadoraId)?.nome||"Operadora"):"Particular",r.length,r.reduce((a,p)=>a+p.horas,0),l.filter(p=>p.evolucao).length,l.filter(p=>p.status==="falta").length,brl(r.reduce((a,p)=>a+(+p.valorCobrado||0),0))]; }); }
  if(rel.tipo==="prontuario"){ head=["Data","Horário","Profissional","Sinais vitais","Evolução"];
    if(!rel.pac) nota="Escolha um paciente para ver o prontuário.";
    rows=rel.pac?pls.filter(p=>p.evolucao).map(p=>{ const e=p.evolucao; return [fmtDay(p.data),`${p.chegada?hhmm(p.chegada.em):p.inicio}–${p.saida?hhmm(p.saida.em):fim(p)}`,proName(e.por||p.profId),[e.pa&&"PA "+e.pa,e.fc&&"FC "+e.fc,e.temp&&e.temp+"°C",e.sat&&"SpO₂ "+e.sat+"%",e.glic&&"Glic "+e.glic].filter(Boolean).join(" · "),e.texto]; }):[]; }
  if(rel.tipo==="estoque"){ head=["Data","Produto","Quantidade","Paciente","Custo"];
    const ms=Store.all("movEstoque").filter(m=>m.tipo==="saida"&&m.data>=rel.de&&m.data<=rel.ate&&(!rel.pac||m.pacId===rel.pac)).sort((a,b)=>a.data.localeCompare(b.data));
    rows=ms.map(m=>{ const pr=Store.get("produtos",m.prodId); return [fmtDay(m.data),pr?.nome||"-",`${m.qtd} ${pr?.unidade||""}`,m.pacId?pacName(m.pacId):"-",brl((+pr?.custo||0)*m.qtd)]; });
    foot=["Total","","","",brl(ms.reduce((a,m)=>a+(+Store.get("produtos",m.prodId)?.custo||0)*m.qtd,0))]; }
  if(rel.tipo==="teleconsultas"){ head=["Data","Hora","Paciente","Especialidade","Profissional","Situação","Pagamento","Valor"];
    const cs=Store.all("consultas").filter(c=>c.data>=rel.de&&c.data<=rel.ate&&(!rel.pac||c.pacId===rel.pac)&&(!rel.pro||c.profId===rel.pro)).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
    rows=cs.map(c=>[fmtDay(c.data),c.hora,pacName(c.pacId),TELE_NAME[c.esp],proName(c.profId),CONS_ST[c.status][0],c.pagamento==="pago"?"Pago":"Pendente",brl(c.valor)]);
    foot=["Total",`${cs.length} consultas`,"","","","",`${cs.filter(c=>c.pagamento==="pago").length} pagas`,brl(cs.filter(c=>c.status!=="cancelada").reduce((a,c)=>a+(+c.valor||0),0))]; }
  if(rel.tipo==="monitoramento"){ head=["Paciente","Perfil","Medições no período","Alertas","Alertas resolvidos","Adesão 7 dias","Última medição"];
    rows=Store.all("pacientes").filter(p=>p.programa==="sim"&&(!rel.pac||p.id===rel.pac)).map(p=>{ const ms=medsDe(p.id).filter(m=>m.em.slice(0,10)>=rel.de&&m.em.slice(0,10)<=rel.ate), al=ms.filter(m=>(m.alertas||[]).length); return [p.nome,(p.perfis||[]).join(", "),ms.length,al.length,al.filter(m=>m.alertaStatus==="resolvido").length,adesao(p)+"%",ms.at(-1)?fmtDT(ms.at(-1).em)+" · "+resumoMed(ms.at(-1)):"-"]; }); }
  if(rel.tipo==="intercorrencias"){ head=["Quando","Paciente","Tipo","Gravidade","Descrição","Conduta","Registrado por"];
    rows=Store.all("intercorrencias").filter(i=>i.em.slice(0,10)>=rel.de&&i.em.slice(0,10)<=rel.ate&&(!rel.pac||i.pacId===rel.pac)).sort((a,b)=>a.em.localeCompare(b.em)).map(i=>[fmtDT(i.em),pacName(i.pacId),i.tipo,i.gravidade,i.descricao,i.conduta||"-",i.por||""]); }
  if(rel.tipo==="financeiro"){ head=["Mês","Plantões","Faturado","Recebido","Custo profissionais","Margem"];
    const by={}; pls.filter(p=>p.status==="realizado").forEach(p=>(by[p.data.slice(0,7)]=by[p.data.slice(0,7)]||[]).push(p));
    rows=Object.entries(by).sort().map(([m,l])=>{ const f=l.reduce((a,p)=>a+(+p.valorCobrado||0),0), c=l.reduce((a,p)=>a+valorProf(p),0); return [mesLabel(m),l.length,brl(f),brl(l.filter(p=>p.recebido).reduce((a,p)=>a+(+p.valorCobrado||0),0)),brl(c),brl(f-c)]; }); }
  CSV_ROWS=[head,...rows,...(foot?[foot]:[])];
  const titulo=REL_TIPOS.find(x=>x[0]===rel.tipo)[1];
  return `<div class="pagehead no-print"><div><h1>Relatórios</h1><p class="sub">Escolha o relatório e o período</p></div>${exportBar("relatorio-"+rel.tipo)}</div>
  <section class="card no-print"><div class="fgrid">
    <label class="f">Relatório<select id="rel_tipo">${REL_TIPOS.map(([k,l])=>`<option value="${k}" ${rel.tipo===k?"selected":""}>${l}</option>`).join("")}</select></label>
    <label class="f">De<input id="rel_de" type="date" value="${rel.de}"></label><label class="f">Até<input id="rel_ate" type="date" value="${rel.ate}"></label>
    <label class="f">Paciente<select id="rel_pac"><option value="">Todos</option>${Store.all("pacientes").map(p=>`<option value="${p.id}" ${rel.pac===p.id?"selected":""}>${esc(p.nome||p.responsavel)}</option>`).join("")}</select></label>
    <label class="f">Profissional<select id="rel_pro"><option value="">Todos</option>${Store.all("profissionais").map(p=>`<option value="${p.id}" ${rel.pro===p.id?"selected":""}>${esc(p.nome)}</option>`).join("")}</select></label></div></section>
  <section class="card"><div class="print-head"><img src="${LOGO}" alt=""><div><b>${esc(Store.cfg().nome||"Viver Bem Atendimento Domiciliar")}</b><span>${titulo} · ${fmtDay(rel.de)} a ${fmtDay(rel.ate)}${rel.pac?" · "+esc(pacName(rel.pac)):""}${rel.pro?" · "+esc(proName(rel.pro)):""}</span></div></div>
    <h2 class="no-print" style="margin-bottom:10px">${titulo}</h2>
    ${nota?`<p class="empty">${nota}</p>`:`<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${head.length}" class="empty">Nada no período.</td></tr>`}</tbody>${foot?`<tfoot><tr>${foot.map(v=>`<td><b>${esc(v)}</b></td>`).join("")}</tr></tfoot>`:""}</table></div>`}
    <p class="small muted" style="margin-top:10px">Gerado em ${fmtDT(new Date().toISOString())} por ${esc(S.nome)}</p></section>`;
}

/* =================== MONITORAMENTO DE CRÔNICOS =================== */
const parsePA = s => { const m=String(s||"").match(/(\d{2,3})\s*[\/x]\s*(\d{2,3})/); return m?[+m[1],+m[2]]:null; };
function limites(p){ return {paMax:parsePA(p?.paMax)||[140,90], paMin:parsePA(p?.paMin)||[90,60], glicMin:+p?.glicMin||70, glicMax:+p?.glicMax||250, fcMin:+p?.fcMin||50, fcMax:+p?.fcMax||110, satMin:+p?.satMin||92}; }
function avaliaMedicao(m,p){ const L=limites(p), a=[], pa=parsePA(m.pa);
  if(pa){ if(pa[0]>=L.paMax[0]||pa[1]>=L.paMax[1]) a.push(`Pressão alta ${pa[0]}/${pa[1]}`); if(pa[0]<=L.paMin[0]||pa[1]<=L.paMin[1]) a.push(`Pressão baixa ${pa[0]}/${pa[1]}`); }
  if(m.glic!==""&&m.glic!=null){ if(+m.glic<L.glicMin) a.push(`Glicemia baixa ${m.glic}`); if(+m.glic>L.glicMax) a.push(`Glicemia alta ${m.glic}`); }
  if(m.fc!==""&&m.fc!=null){ if(+m.fc<L.fcMin) a.push(`FC baixa ${m.fc}`); if(+m.fc>L.fcMax) a.push(`FC alta ${m.fc}`); }
  if(m.sat!==""&&m.sat!=null&&+m.sat<L.satMin) a.push(`Saturação ${m.sat}%`);
  (m.sintomas||[]).filter(x=>SINT_ALERTA.includes(x)).forEach(x=>a.push(x));
  return a; }
const medsDe = id => Store.all("medicoes").filter(m=>m.pacId===id).sort((a,b)=>a.em.localeCompare(b.em));
function adesao(p){ const f=p.freqMed||"1", n=medsDe(p.id).filter(m=>Date.now()-new Date(m.em).getTime()<7*864e5).length, esp=f==="2"?14:f==="7"?1:7; return Math.min(100,Math.round(n/esp*100)); }
const resumoMed = m => [m.pa&&"PA "+m.pa, m.glic!==""&&m.glic!=null&&"Glic "+m.glic, m.fc!==""&&m.fc!=null&&"FC "+m.fc, m.sat!==""&&m.sat!=null&&"SpO₂ "+m.sat+"%", m.peso&&m.peso+" kg", m.temp&&m.temp+" °C"].filter(Boolean).join(" · ");
function trendSVG(meds, get, titulo, refs=[]){
  const pts=meds.map(m=>({t:new Date(m.em).getTime(),v:get(m)})).filter(x=>x.v!=null&&x.v!==""&&!(typeof x.v==="number"&&isNaN(x.v)));
  if(pts.length<2) return "";
  const W=320,H=128,L=34,R=8,T=14,B=22, t0=pts[0].t, t1=pts.at(-1).t;
  const vals=pts.flatMap(x=>Array.isArray(x.v)?x.v:[x.v]).concat(refs); let lo=Math.min(...vals), hi=Math.max(...vals); const pd=(hi-lo)*.15||5; lo=Math.floor(lo-pd); hi=Math.ceil(hi+pd);
  const X=t=>L+(t-t0)/((t1-t0)||1)*(W-L-R), Y=v=>T+(hi-v)/(hi-lo)*(H-T-B), multi=Array.isArray(pts[0].v);
  const line=(i,cor)=>`<polyline fill="none" style="stroke:${cor}" stroke-width="2" stroke-linejoin="round" points="${pts.map(x=>`${X(x.t).toFixed(1)},${Y(multi?x.v[i]:x.v).toFixed(1)}`).join(" ")}"/><circle cx="${X(pts.at(-1).t)}" cy="${Y(multi?pts.at(-1).v[i]:pts.at(-1).v)}" r="3.5" style="fill:${cor}"/>`;
  return `<figure class="trend"><figcaption>${esc(titulo)}</figcaption><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(titulo)}">
    <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" style="stroke:var(--line)"/>
    <text x="${L-5}" y="${T+4}" text-anchor="end" style="fill:var(--muted);font-size:10px">${hi}</text><text x="${L-5}" y="${H-B}" text-anchor="end" style="fill:var(--muted);font-size:10px">${lo}</text>
    ${refs.map(r=>`<line x1="${L}" x2="${W-R}" y1="${Y(r)}" y2="${Y(r)}" style="stroke:var(--bad)" stroke-dasharray="4 3"/><text x="${W-R}" y="${Y(r)-3}" text-anchor="end" style="fill:var(--bad);font-size:9.5px">limite ${r}</text>`).join("")}
    ${multi?line(0,"var(--blue)")+line(1,"var(--copper)"):line(0,"var(--blue)")}
    <text x="${L}" y="${H-6}" style="fill:var(--muted);font-size:10px">${fmtDay(isoDay(new Date(t0))).slice(0,5)}</text><text x="${W-R}" y="${H-6}" text-anchor="end" style="fill:var(--muted);font-size:10px">${fmtDay(isoDay(new Date(t1))).slice(0,5)}</text></svg>${multi?'<p class="small muted"><span style="color:var(--blue)">●</span> sistólica · <span style="color:var(--copper)">●</span> diastólica</p>':""}</figure>`;
}
function monGraficos(p, dias=30){ const ms=medsDe(p.id).filter(m=>Date.now()-new Date(m.em).getTime()<dias*864e5), L=limites(p);
  const g=[trendSVG(ms,m=>parsePA(m.pa),"Pressão arterial (mmHg)",[L.paMax[0]]), trendSVG(ms,m=>m.glic===""?null:+m.glic,"Glicemia (mg/dL)",[L.glicMin,L.glicMax]), trendSVG(ms,m=>m.sat===""?null:+m.sat,"Saturação (%)",[L.satMin]), trendSVG(ms,m=>m.fc===""?null:+m.fc,"Frequência cardíaca (bpm)",[]), trendSVG(ms,m=>m.peso===""||m.peso==null?null:+m.peso,"Peso (kg)",[])].filter(Boolean);
  return g.length?`<div class="trends">${g.join("")}</div>`:`<p class="empty">Ainda não há medições suficientes para os gráficos.</p>`; }
function medTabela(ms){ return `<div class="tablewrap"><table><thead><tr><th>Quando</th><th>Medição</th><th>Sintomas</th><th>Por</th><th>Situação</th></tr></thead><tbody>${ms.slice().reverse().slice(0,40).map(m=>`<tr><td class="num">${fmtDT(m.em)}</td><td>${esc(resumoMed(m)||"-")}</td><td>${esc((m.sintomas||[]).join(", ")||"-")}${m.obs?`<div class="small muted">${esc(m.obs)}</div>`:""}</td><td class="small">${esc(m.por||"")}</td><td>${(m.alertas||[]).length?`<span class="pill ${m.alertaStatus==="aberto"?"p-bad":"p-ok"}">${m.alertaStatus==="aberto"?"Alerta":"Alerta resolvido"}</span>`:'<span class="pill p-mute">Normal</span>'}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">Nenhuma medição.</td></tr>`}</tbody></table></div>`; }
function pgMonitoramento(){

  const abertos=Store.all("medicoes").filter(m=>m.alertaStatus==="aberto").sort((a,b)=>b.em.localeCompare(a.em));
  const semMed=prog.filter(p=>{ const u=medsDe(p.id).at(-1); return !u||Date.now()-new Date(u.em).getTime()>3*864e5; });
  const ad=prog.length?Math.round(prog.reduce((a,p)=>a+adesao(p),0)/prog.length):0;
  return `<div class="pagehead"><div><h1>Monitoramento de crônicos</h1><p class="sub">Medições registradas por pacientes, famílias e equipe, com alertas pelas faixas de cada paciente</p></div><button class="btn btn-primary" data-act="novaMed">${ICON.plus}Registrar medição</button></div>

  <section class="card"><h2>Alertas</h2><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Quando</th><th>Paciente</th><th>Alerta</th><th>Medição</th><th></th></tr></thead><tbody>
    ${abertos.map(m=>`<tr><td class="num">${fmtDT(m.em)}</td><td><a href="#paciente-${m.pacId}"><b>${esc(pacName(m.pacId))}</b></a></td><td><div class="chips">${m.alertas.map(a=>`<span class="pill p-bad">${esc(a)}</span>`).join("")}</div></td><td class="small">${esc(resumoMed(m))}${(m.sintomas||[]).length?`<div class="muted">Sintomas: ${esc(m.sintomas.join(", "))}</div>`:""}</td><td class="r"><button class="btn btn-sm btn-primary" data-act="conduta" data-id="${m.id}">Registrar conduta</button></td></tr>`).join("")||`<tr><td colspan="5" class="empty">Nenhum alerta aberto.</td></tr>`}</tbody></table></div></section>
  <section class="card"><h2>Pacientes no programa</h2><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Paciente</th><th>Perfil</th><th>Última medição</th><th class="r">Adesão 7 dias</th><th>Reavaliação</th></tr></thead><tbody>
    ${prog.map(p=>{ const u=medsDe(p.id).at(-1), a=adesao(p); return `<tr class="click" data-act="go" data-id="paciente-${p.id}"><td><b>${esc(p.nome)}</b>${ex(p)}<div class="small muted">${esc(MOD_LOCAL[p.modalidade||"domicilio"])}</div></td><td><div class="chips">${(p.perfis||[]).map(x=>`<span class="pill p-blue">${esc(x)}</span>`).join("")||"-"}</div></td><td>${u?`${fmtDT(u.em)}<div class="small muted">${esc(resumoMed(u))}</div>`:'<span class="pill p-warn">Sem medições</span>'}</td><td class="r"><span class="pill ${a>=80?"p-ok":a>=50?"p-warn":"p-bad"}">${a}%</span></td><td class="num">${p.proxReavaliacao?`<span class="${p.proxReavaliacao<=t?"pill p-bad":""}">${fmtDay(p.proxReavaliacao)}</span>`:"-"}</td></tr>`; }).join("")||`<tr><td colspan="5" class="empty">Nenhum paciente no programa. Ative em Editar paciente → Monitoramento de crônicos.</td></tr>`}</tbody></table></div></section>
  <p class="small muted">O monitoramento não substitui atendimento de emergência. As faixas de alerta são definidas pelo profissional responsável na ficha de cada paciente.</p>`;
}

async function syncAgendaTele(p){
  const old=Store.get("agendaTele",p.id);
  if(!p.teleEsp&&!old) return;
  await Store.put("agendaTele",{id:p.id,nome:p.nome,funcao:p.funcao,registro:p.registro||"",esp:p.teleEsp||"",dias:p.teleDias||[],ini:p.teleIni||"",fim:p.teleFim||"",dur:+p.teleDur||30,ativo:!!p.teleEsp&&p.status==="ativo",ocupados:old?.ocupados||[]});
}
async function syncOcupados(profId){ const a=Store.get("agendaTele",profId); if(!a) return;
  a.ocupados=Store.all("consultas").filter(c=>c.profId===profId&&["solicitada","agendada"].includes(c.status)&&c.data>=today()).map(c=>`${c.data} ${c.hora}`); await Store.put("agendaTele",a); }
function horarios(profId, dias=14){ const a=Store.get("agendaTele",profId); if(!a||!a.ativo||!a.ini||!a.fim) return [];
  const occ=new Set([...(a.ocupados||[]), ...Store.all("consultas").filter(c=>c.profId===profId&&["solicitada","agendada"].includes(c.status)).map(c=>`${c.data} ${c.hora}`)]);
  const toM=h=>{ const [x,y]=h.split(":").map(Number); return x*60+y; }, out=[], limite=Date.now()+2*36e5;
  for(let i=0;i<dias;i++){ const d=addDays(today(),i), wd=new Date(d+"T12:00").getDay(); if(!(a.dias||[]).includes(DIAS.at(wd))) continue;
    for(let m=toM(a.ini); m+(+a.dur||30)<=toM(a.fim); m+=(+a.dur||30)){ const h=`${pad(Math.floor(m/60))}:${pad(m%60)}`; if(occ.has(`${d} ${h}`)) continue; if(new Date(`${d}T${h}`).getTime()<limite) continue; out.push({data:d,hora:h}); } }
  return out; }

function verTele(id){
  const c=Store.get("consultas",id); if(!c) return; const pac=Store.get("pacientes",c.pacId)||{}, cfg=Store.cfg(), role=S.role, ativo=["agendada","solicitada"].includes(c.status);

// Cada bloco: título (com "| domicilio", "| ilpi" ou "| hospital" quando for modalidade),
// a descrição nas linhas seguintes e os itens começando com "-".
function parseServicos(txt){
  return String(txt||"").split(/\n\s*\n/).map(bloco=>{
    const L=bloco.split("\n").map(x=>x.trim()).filter(Boolean); if(!L.length) return null;
    const [t,k]=L[0].split("|").map(x=>x.trim());
    if(!t) return null;
    return {k:k||"", t, d:L.slice(1).filter(x=>!x.startsWith("-")).join(" "),
      itens:L.slice(1).filter(x=>x.startsWith("-")).map(x=>x.replace(/^-\s*/,"").trim()).filter(Boolean)};
  }).filter(Boolean);
}

let pontoIni=null, pontoOc=false, pontoPro="";
function pgPonto(){
  if(!pontoIni) pontoIni=weekStart(today());
  const ate=addDays(pontoIni,6), now=Date.now();
  const rows=Store.all("plantoes").filter(p=>p.data>=pontoIni&&p.data<=ate&&p.status!=="cancelado"&&tStart(p)<=now&&(!pontoPro||p.profId===pontoPro)).sort((a,b)=>tStart(b)-tStart(a)).map(p=>{
    const pac=Store.get("pacientes",p.pacId), ch=regInfo(p.chegada,pac), sa=regInfo(p.saida,pac), at=atrasoMin(p), oc=[];
    if(p.status==="falta") oc.push(["Falta","p-bad"]);
    else if(!p.chegada) oc.push([tStart(p)<now-30*6e4?"Não registrou chegada":"Aguardando chegada",tStart(p)<now-30*6e4?"p-bad":"p-blue"]);
    if(at>15) oc.push([`Atraso ${at} min`,"p-warn"]);
    if(ch?.longe||sa?.longe) oc.push(["Fora do endereço","p-bad"]);
    if(p.chegada&&!p.saida&&tEnd(p)<now-36e5) oc.push(["Sem registro de saída","p-warn"]);
    if(ch?.semGeo||sa?.semGeo) oc.push(["Sem localização","p-mute"]);
    return {p,pac,ch,sa,at,oc,h:p.chegada&&p.saida?(new Date(p.saida.em)-new Date(p.chegada.em))/36e5:null}; });
  const comCh=rows.filter(r=>r.p.chegada), pont=comCh.filter(r=>r.at<=15).length;
  const list=pontoOc?rows.filter(r=>r.oc.length&&!(r.oc.length===1&&r.oc[0][0]==="Aguardando chegada")):rows;
  const cell=(r,raw)=> r?`<b class="num">${r.hora}</b><div class="small">${r.semGeo?'<span class="muted">sem localização</span>':r.d==null?'<span class="muted">casa sem localização</span>':`<span style="color:var(${r.longe?"--bad":"--ok"})">${r.longe?"a "+fmtDist(r.d):"no endereço"}</span>`}${r.map?` · <a href="${r.map}" target="_blank" rel="noopener">mapa</a>`:""}</div>`:'<span class="muted">-</span>';
  return `<div class="pagehead"><div><h1>Chegadas e saídas</h1><p class="sub">${fmtDay(pontoIni)} a ${fmtDay(ate)} · registros feitos pelo celular dos profissionais, com horário e localização</p></div>
    <div class="actions"><button class="btn btn-line btn-sm" data-act="pontoSem" data-id="-7">‹ Anterior</button><button class="btn btn-line btn-sm" data-act="pontoSem" data-id="0">Esta semana</button><button class="btn btn-line btn-sm" data-act="pontoSem" data-id="7">Próxima ›</button></div></div>
  <div class="kpis">
    <div class="kpi"><b>${rows.filter(r=>r.p.status==="andamento").length}</b><span>Em atendimento agora</span></div>
    <div class="kpi"><b>${comCh.length?Math.round(pont/comCh.length*100):0}%</b><span>Chegadas no horário (até 15 min)</span></div>
    <div class="kpi ${rows.some(r=>r.at>15)?"alert":""}"><b>${rows.filter(r=>r.at>15).length}</b><span>Atrasos</span></div>
    <div class="kpi"><b>${rows.filter(r=>r.oc.some(o=>o[0]==="Não registrou chegada"||o[0]==="Falta")).length}</b><span>Sem chegada ou falta</span></div>
    <div class="kpi"><b>${rows.filter(r=>r.oc.some(o=>o[0]==="Fora do endereço")).length}</b><span>Fora do endereço</span></div>
  </div>
  <div class="toolbar"><select id="pontoPro" aria-label="Filtrar profissional"><option value="">Todos os profissionais</option>${Store.all("profissionais").map(p=>`<option value="${p.id}" ${pontoPro===p.id?"selected":""}>${esc(p.nome)}</option>`).join("")}</select>
    <button class="chipbtn" data-act="pontoOc" aria-pressed="${pontoOc}">Só ocorrências</button></div>
  <div class="tablewrap"><table><thead><tr><th>Plantão previsto</th><th>Paciente</th><th>Profissional</th><th>Chegada</th><th>Saída</th><th class="r">Horas</th><th>Ocorrências</th></tr></thead><tbody>
  ${list.map(r=>`<tr class="click" data-act="plantao" data-id="${r.p.id}"><td class="num">${fmtDay(r.p.data).slice(0,5)} · ${r.p.inicio}–${fim(r.p)}</td><td><b>${esc(r.pac?.nome||"-")}</b></td><td>${esc(proName(r.p.profId))}</td><td>${cell(r.ch,r.p.chegada)}</td><td>${cell(r.sa,r.p.saida)}</td><td class="r">${r.h!=null?r.h.toFixed(1).replace(".",","):"-"}</td><td><div class="chips">${r.oc.map(([l,c])=>`<span class="pill ${c}">${l}</span>`).join("")||'<span class="pill p-ok">OK</span>'}</div></td></tr>`).join("")||`<tr><td colspan="7" class="empty">Nenhum registro neste período.</td></tr>`}
  </tbody></table></div>
  <p class="small muted">A localização é comparada com a localização cadastrada na ficha do paciente. Acima da distância permitida aparece como fora do endereço. Pacientes com check-in "só no endereço" bloqueiam o registro fora dessa distância.</p>`;
}

function wzRead(){ const d=wz.d; if(wz.step===1) Object.assign(d,readFields(W1)); if(wz.step===2) Object.assign(d,readFields(W2())); if(wz.step===3) d.resumo=$("#f_resumo")?.value.trim()||""; }
function wzCheck(){
  const d=wz.d, s=wz.step;
  if(s===1){ const m=missing(W1,d); if(m) return m; if(d.nome.split(" ").filter(Boolean).length<2) return "Informe seu nome completo."; if(!validDoc(d.cpf)) return "CPF ou CNPJ inválido. Confira os números."; d.cpf=digits(d.cpf); if(digits(d.tel).length<10) return "Informe o WhatsApp com DDD."; if(!/.+@.+\..+/.test(d.email)) return "Informe um e-mail válido."; }
  if(s===2){ const m=missing(W2(),d); if(m) return m; if(!/\d{3,}/.test(d.registro)) return `Informe o número de inscrição no ${FUNCOES[d.funcao]||"conselho"}.`; }
  if(s===3){ const f=DOCS.find(([k])=>!(d.docs||{})[k]); if(f) return `Envie: ${f[1]}.`; }
  return "";
}

function docSlot([k,l,h]){ const d=(wz.d.docs||{})[k], img=wz._docs?.[k];
  return `<label class="docslot ${d?"ok":""}" for="doc_${k}"><span class="docthumb">${img&&img.startsWith("data:image")?`<img src="${img}" alt="">`:d?"PDF":k==="selfie"?"🙂":"+"}</span><span class="doctext"><b>${l} <i class="req">*</i></b><small>${h}</small><small class="docst">${d?`Enviado: ${esc(d.nome)} (${d.kb} KB) · toque para trocar`:"Toque para enviar"}</small></span>
    <input id="doc_${k}" data-doc="${k}" type="file" accept="${k==="curriculo"?".pdf,.doc,.docx,image/*":k==="endereco"?"image/*,.pdf":"image/*"}" ${k==="selfie"?'capture="user"':""} class="sr"></label>`; }
async function docInput(input, store, onDone){ const file=input.files[0]; if(!file) return; const k=input.dataset.doc;
  try{ const data=await prepFile(file); store.data[k]=data; store.meta[k]={nome:file.name,kb:Math.max(1,Math.round(data.length*0.75/1024)),em:new Date().toISOString()}; onDone(); }
  catch(err){ input.value=""; toast(err.message); } }
/* currículo: fotos são reduzidas; PDF/Word até 700 KB (cabe num documento do banco) */
function prepFile(file){
  return new Promise((ok,ko)=>{
    const rd=new FileReader(); rd.onerror=()=>ko(new Error("Não foi possível ler o arquivo."));
    if(file.type.startsWith("image/")){
      rd.onload=()=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,1400/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); ok(c.toDataURL("image/jpeg",0.72)); }; img.onerror=()=>ko(new Error("Imagem inválida.")); img.src=rd.result; };
    } else {
      if(!/pdf|word|document|msword/.test(file.type)&&!/\.(pdf|docx?)$/i.test(file.name)) return ko(new Error("Formato não aceito. Envie foto, PDF ou Word."));
      if(file.size>700*1024) return ko(new Error("Arquivo maior que 700 KB. Envie um PDF menor ou uma foto."));
      rd.onload=()=>ok(rd.result);
    }
    rd.readAsDataURL(file);
  });
}

function bindPublic(r){
  if(r==="trabalhe"){ const f=$("#fWz"); if(!f) return;
    $$("input[data-doc]",f).forEach(inp=>inp.onchange=()=>{ wz._docs=wz._docs||{}; wz.d.docs=wz.d.docs||{};
      docInput(inp,{data:wz._docs,meta:wz.d.docs},()=>{ const sl=inp.closest(".docslot"); sl.outerHTML=docSlot(DOCS.find(x=>x[0]===inp.dataset.doc)); bindPublic("trabalhe"); }); });
    f.onsubmit=async e=>{ e.preventDefault(); wzRead(); const m=wzCheck(); if(m) return showErr(f,m);
      if(wz.step<4){ wz.step++; render(); return; }
      if(!["a1","a2","a3"].every(id=>$("#"+id).checked)) return showErr(f,"Marque os três termos para enviar.");
      const btn=$("button:last-of-type",f); btn.disabled=true;
      try{
        if(Store.mode==="demo" && Store.all("candidatos").some(c=>c.cpf===wz.d.cpf&&!c.exemplo)) { btn.disabled=false; return showErr(f,"Já existe uma candidatura com este CPF. Use Acompanhar candidatura."); }
        const now=new Date().toISOString(), id="VB-"+Math.random().toString(36).slice(2,8).toUpperCase();
        btn.textContent="Enviando documentos...";
        for(const [k] of DOCS){ await Store.put("documentos",{id:`${id}_${k}`,cand:id,tipo:k,nome:wz.d.docs[k].nome,data:wz._docs[k]}); }
        await Store.put("candidatos",{...wz.d,id,status:"recebido",hist:[{s:"recebido",em:now}],aceites:now,notas:""});
        wz={step:5,d:{exp:[],disp:[]},done:id}; render(); window.scrollTo(0,0);
      }catch(err){ btn.disabled=false; showErr(f,"Não foi possível enviar agora. Verifique a internet e tente de novo."); }
    };
  }
  if(r==="acompanhar"){ $$("#fRe input[data-doc]").forEach(inp=>inp.onchange=()=>docInput(inp,acompDocs,render)); }
  if(r==="acompanhar"){ const f=$("#fAc"); if(f) f.onsubmit=async e=>{ e.preventDefault(); const cpf=digits($("#f_cpf").value), id=$("#f_proto").value.trim().toUpperCase();
    const c=id?await Store.fetchOne("candidatos",id):null; if(!c||c.cpf!==cpf) return showErr(f,"Não encontramos candidatura com esse CPF e protocolo. Confira os dados.");
    acomp={c, ct:c.contratoId?await Store.fetchOne("contratos",c.contratoId):null}; render(); }; }
  if(r==="assinar"){ const f=$("#fSign"); if(f) f.onsubmit=async e=>{ e.preventDefault(); const c=window._ct, nome=$("#f_sNome").value.trim(), cpf=digits($("#f_sCpf").value);
    const espNome=c.tipo==="autonomo"?c.dados.nome:c.dados.respNome, espCpf=digits(c.tipo==="autonomo"?c.dados.cpf:c.dados.respCpf);
    if(norm(nome)!==norm(espNome)) return showErr(f,`O nome precisa ser igual ao do contrato: ${espNome}.`);
    if(espCpf && cpf!==espCpf) return showErr(f,`O ${docLabel(espCpf)} não confere com o do contrato.`);
    if(!validDoc(cpf)) return showErr(f,"CPF ou CNPJ inválido.");
    if(!$("#sOk").checked) return showErr(f,"Marque que leu e concorda com o contrato.");
    const em=new Date().toISOString();
    c.status="assinado"; c.assinatura={nome,cpf,em,hash:await sha(c.id+cpf+em+c.html.length),disp:navigator.userAgent.slice(0,140)};
    try{ await Store.put("contratos",c); toast("Contrato assinado"); render(); }catch(err){ showErr(f,"Não foi possível assinar agora. Tente de novo."); } }; }
  if(r==="solicitar"){ const f=$("#fSol"); if(f) f.onsubmit=async e=>{ e.preventDefault(); const spec=solPub==="familia"?SF():SO; const v=readFields(spec,f); const m=missing(spec,v); if(m) return showErr(f,m);
    if(digits(v.tel).length<10) return showErr(f,"Informe o telefone com DDD."); if(!$("#solOk").checked) return showErr(f,"Marque a autorização de contato.");
    await Store.put("solicitacoes",{id:uid("s"),tipo:solPub,status:"novo",...v});
    const cfg=Store.cfg();
    f.outerHTML=`<div class="okbox"><h2>Solicitação enviada</h2><p>Nossa equipe vai entrar em contato pelo telefone ${esc(v.tel)}.</p>${cfg.whatsapp&&solPub==="familia"?`<div class="actions"><a class="btn btn-primary" target="_blank" rel="noopener" href="${wa(cfg.whatsapp,`Olá, Viver Bem! Sou ${v.nome}, de ${v.cidade}. Gostaria de uma avaliação. Atendimento: ${v.servico}. Paciente: ${v.paciente||"-"}`)}">${ICON.wa}Falar agora no WhatsApp</a></div>`:""}</div>`; }; }
}

async function buscaCep(input){
  const pre=input.id.slice(2,-3), root=input.closest(".modal-b,form,section,.card")||document, d=digits(input.value);
  if(input.dataset.last===d) return; input.dataset.last=d;
  const set=(k,v)=>{ const el=$("#f_"+pre+k,root)||$("#f_"+pre+k); if(el&&v) el.value=v; };
  try{ const r=await (await fetch(`https://viacep.com.br/ws/${d}/json/`)).json(); if(r.erro) return toast("CEP não encontrado. Preencha o endereço manualmente.");
    set("rua",r.logradouro); set("bairro",r.bairro); set("cidade",r.localidade); set("uf",r.uf); if(r.complemento) set("complemento",r.complemento);
    ($("#f_"+pre+"numero",root)||$("#f_"+pre+"numero"))?.focus(); }
  catch(_){ /* sem internet ou bloqueado: preenchimento manual */ }
}

/* ---------- Painel: operação e prontuários do mês ---------- */
function prontStats(mes){
  const exigePac=(Store.cfg().assinaPaciente||"nao")!=="nao", agora=Date.now();
  const pls=Store.all("plantoes").filter(p=>p.data.startsWith(mes)&&p.status!=="cancelado");
  const fin=pls.filter(p=>p.status==="realizado");
  const pre=fin.filter(p=>p.evolucao), assP=fin.filter(p=>p.evolucao?.assProf), assPac=fin.filter(assPacOk);
  const venc=pls.filter(p=>["agendado","andamento"].includes(p.status)&&tEnd(p)<agora-36e5).sort((a,b)=>tStart(a)-tStart(b));
  const completos=fin.filter(p=>p.evolucao&&p.evolucao.assProf&&(!exigePac||assPacOk(p)));
  return {pls,fin,pre,assP,assPac,venc,completos,exigePac,faltas:pls.filter(p=>p.status==="falta")};
}
function ring(pct,label){ const R=46,C=2*Math.PI*R;
  return `<svg viewBox="0 0 120 120" width="130" height="130" role="img" aria-label="${pct}% ${label.toLowerCase()}"><circle r="${R}" cx="60" cy="60" fill="none" style="stroke:var(--line)" stroke-width="12"/><circle r="${R}" cx="60" cy="60" fill="none" style="stroke:var(--ok)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(C*pct/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/><text x="60" y="64" text-anchor="middle" style="fill:var(--ink);font:500 24px var(--f-display)">${pct}%</text><text x="60" y="82" text-anchor="middle" style="fill:var(--muted);font:700 8px var(--f-body);letter-spacing:.1em">${label}</text></svg>`; }
function progRow(l,n,t,extra){ const pc=t?Math.round(n/t*100):0; return `<div class="prog"><div><span>${l}</span>${extra||`<b class="num">${n}/${t}</b>`}</div>${extra?"":`<div class="meter"><i style="width:${pc}%;background:var(--ok)"></i></div>`}</div>`; }
function painelBreak(hoje,grp){
  const tot=hoje.length, it=[["nao","Não iniciados","Aguardando o profissional","var(--blue)"],["atrasado","Atrasados","Precisam de atenção","var(--bad)"],["andamento","Em andamento","Profissional em campo","var(--copper)"],["concluido","Concluídos","Atendimentos finalizados","var(--ok)"]];
  return `<div class="kpis">${it.map(([k,l,s,c])=>{ const n=grp[k].n, pc=tot?Math.round(n/tot*100):0; return `<div class="kpi"><small class="kl">${l}</small><div class="kpi-row"><b>${n}</b><span class="num">${pc}%</span></div><span>${s}</span><div class="meter"><i style="width:${pc}%;background:${c}"></i></div></div>`; }).join("")}</div>`;
}

}

/* ---------- Conferência mensal, frequência, centros de custos ---------- */
function pgConferencia(){

  const pacs=[...new Set(st.pls.map(p=>p.pacId))].map(id=>Store.get("pacientes",id)).filter(Boolean).sort((a,b)=>(a.nome||"").localeCompare(b.nome||""));
  const linha=pac=>{ const l=st.pls.filter(p=>p.pacId===pac.id), f=l.filter(p=>p.status==="realizado");
    return {l,f,semEvo:f.filter(p=>!p.evolucao).length,semAP:f.filter(p=>p.evolucao&&!p.evolucao.assProf).length,semAPac:exige?f.filter(p=>!assPacOk(p)).length:0,venc:st.venc.filter(p=>p.pacId===pac.id).length,faltas:l.filter(p=>p.status==="falta").length,cf:Store.get("conferencias",`cf-${pac.id}-${mes}`)}; };
  const L=pacs.map(p=>({p,...linha(p)})), conf=L.filter(x=>x.cf).length, pct=st.fin.length?Math.round(st.completos.length/st.fin.length*100):100;
  CSV_ROWS=[["Paciente","Previstos","Realizados","Faltas","Vencidos não finalizados","Sem evolução","Sem assinatura do profissional","Sem assinatura do paciente","Fechamento"],...L.map(x=>[x.p.nome,x.l.length,x.f.length,x.faltas,x.venc,x.semEvo,x.semAP,exige?x.semAPac:"Não exigida",x.cf?`Conferido por ${x.cf.por}`:"Aberto"])];
  return pageHead("Conferência mensal",`${mesCap(mes)} · confira atendimentos, prontuários e assinaturas de cada paciente antes de fechar o mês`,mesBar()+exportBar("conferencia-"+mes))+
  `<div class="kpis"><div class="kpi"><small class="kl">Pacientes conferidos</small><b>${conf} de ${L.length}</b></div><div class="kpi ${pct>=95?"k-green":""}"><small class="kl">Prontuários completos</small><b>${pct}%</b></div><div class="kpi ${st.venc.length?"k-red":""}"><small class="kl">Vencidos não finalizados</small><b>${st.venc.length}</b></div><div class="kpi"><small class="kl">Faltas</small><b>${st.faltas.length}</b></div></div>
  <section class="card"><h2>Fechamento por paciente</h2>${tabela(["Paciente","Previstos|r","Realizados|r","Faltas|r","Vencidos|r","Sem evolução|r","Sem assinatura prof.|r","Sem assinatura paciente|r","Fechamento"],L.map(x=>{ const pend=x.semEvo+x.semAP+x.semAPac+x.venc;
    return {act:"conferir",id:x.p.id,cells:[`<b>${esc(x.p.nome)}</b>`,x.l.length,x.f.length,x.faltas,x.venc?`<span class="pill p-bad">${x.venc}</span>`:0,x.semEvo,x.semAP,exige?x.semAPac:"—",x.cf?`<span class="pill p-ok">Conferido</span><div class="small muted">${esc(x.cf.por)} · ${fmtDay(x.cf.em.slice(0,10))}</div>`:pend?`<span class="pill p-warn">${pend} pendência(s)</span>`:'<span class="pill p-blue">Pronto para conferir</span>']}; }),"Nenhum atendimento neste mês.")}</section>
  <section class="card"><h2>Atendimentos com data vencida e não finalizados</h2><p class="small muted" style="margin:-6px 0 10px">Abra o plantão para registrar a evolução e concluir, lançar chegada e saída, ou marcar falta.</p>${st.venc.length?`<div class="day">${st.venc.map(x=>shiftRow(x).replace('<span class="t">',`<span class="t"><small>${fmtDay(x.data).slice(0,5)}</small>`)).join("")}</div>`:`<p class="empty">Nenhum.</p>`}</section>`;
}
function pgFrequencia(){
  const mes=curMes(), [y,m]=mes.split("-").map(Number), nd=new Date(y,m,0).getDate(), days=[...Array(nd)].map((_,i)=>`${mes}-${pad(i+1)}`), agora=Date.now();

  const sym=l=>{ if(!l.length) return ["",""]; if(l.some(p=>p.status==="falta")) return ["F","fq-f"]; if(l.every(p=>p.status==="realizado")) return [l.length>1?String(l.length):"✓","fq-ok"]; if(l.some(p=>tEnd(p)<agora&&p.status!=="realizado")) return ["!","fq-v"]; return ["•","fq-a"]; };

  const rows=pros.map(pr=>{ const l=pls.filter(p=>p.profId===pr.id), r=l.filter(p=>p.status==="realizado"), cs=days.map(d=>sym(l.filter(p=>p.data===d)));
    CSV_ROWS.push([pr.nome,pr.f,...cs.map(c=>c[0]),r.length,l.filter(p=>p.status==="falta").length,r.reduce((a,p)=>a+p.horas,0)]);
    return `<tr><td><b>${esc(pr.nome)}</b><div class="small muted">${esc(pr.f)}</div></td>${cs.map((c,i)=>`<td class="${c[1]} ${we(days[i])?"we":""}">${c[0]}</td>`).join("")}<td class="r"><b>${r.length}</b></td><td class="r">${l.filter(p=>p.status==="falta").length}</td><td class="r">${r.reduce((a,p)=>a+p.horas,0)}</td></tr>`; }).join("");
  return pageHead("Frequência mensal",`${mesCap(mes)} · presença de cada profissional, dia a dia`,mesBar()+exportBar("frequencia-"+mes))+
  `<section class="card"><div class="tablewrap"><table class="freq"><thead><tr><th>Profissional</th>${days.map(d=>`<th class="${we(d)?"we":""}">${+d.slice(8)}</th>`).join("")}<th class="r">Feitos</th><th class="r">Faltas</th><th class="r">Horas</th></tr></thead><tbody>${rows||`<tr><td colspan="${nd+4}" class="empty">Nenhum plantão neste mês.</td></tr>`}</tbody></table></div>
  <p class="small muted" style="margin-top:10px"><b class="fq-ok">✓</b> realizado (número = mais de um no dia) · <b class="fq-f">F</b> falta · <b class="fq-v">!</b> data passou sem finalizar · <b class="fq-a">•</b> agendado</p></section>`;
}
function pgCentros(){

function pgFinanceiro(id){ finMes=curMes(); return ({previstas:pgFinPrev,despesas:pgDespesas,adiantamentos:pgAdiant,extrato:pgExtrato,conciliacao:pgConciliacao,dre:pgDRE}[id]||pgFinResumo)(); }
function pgFinPrev(){
  const mes=curMes(), pls=Store.all("plantoes").filter(p=>p.data.startsWith(mes)&&!["cancelado","falta"].includes(p.status)), cons=Store.all("consultas").filter(c=>c.data.startsWith(mes)&&c.status!=="cancelada");
  const by={}; pls.forEach(p=>{ const k=pagadorKey(p), o=by[k]||(by[k]={n:0,prev:0,real:0,rec:0}), v=+p.valorCobrado||0; o.n++; o.prev+=v; if(p.status==="realizado") o.real+=v; if(p.recebido) o.rec+=v; });
  const T=Object.values(by).reduce((a,o)=>({n:a.n+o.n,prev:a.prev+o.prev,real:a.real+o.real,rec:a.rec+o.rec}),{n:0,prev:0,real:0,rec:0});
  const tele=sum(cons,c=>c.valor), teleR=cons.filter(c=>c.status==="realizada"), teleP=cons.filter(c=>c.pagamento==="pago");
  const sem={}; pls.forEach(p=>{ const w=weekStart(p.data); sem[w]=sem[w]||{n:0,v:0}; sem[w].n++; sem[w].v+=+p.valorCobrado||0; });
  const rows=Object.entries(by).sort((a,b)=>b[1].prev-a[1].prev);
  CSV_ROWS=[["Pagador","Atendimentos","Previsto","Realizado","A realizar","Recebido"],...rows.map(([k,o])=>[pagadorNome(k),o.n,money(o.prev),money(o.real),money(o.prev-o.real),money(o.rec)])];
  return pageHead("Receitas previstas",`${mesCap(mes)} · tudo o que está agendado no mês, por quem paga`,mesBar()+exportBar("receitas-previstas-"+mes))+
