<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sistema Viver Bem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0F3550">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: sistema de gestão com barra lateral fixa (desktop) que vira gaveta no celular; telas públicas centralizadas sem barra */
:root{
  --blue:#1F648D; --blue-deep:#0F3550; --copper:#B46E43; --copper-soft:#F5E4D8;
  --bg:#F1F5F8; --surface:#FFFFFF; --surface-2:#F7FAFC; --ink:#13293A; --muted:#5A7287; --line:#D8E3EB;
  --ok:#2C7A52; --ok-bg:#E0F2E7; --warn:#93650E; --warn-bg:#FBF0D3; --bad:#A63D3D; --bad-bg:#F8E1E1; --info-bg:#E1EDF5;
  --on-blue:#FFFFFF; --side:#0F3550; --side-ink:#C9DCE8; --side-active:rgba(255,255,255,.12);
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --blue:#62A8D8; --blue-deep:#0A2230; --copper:#E3A57C; --copper-soft:#3B2A1F;
  --bg:#0B161D; --surface:#12212B; --surface-2:#0F1C25; --ink:#E3EDF3; --muted:#93AABB; --line:#23384A;
  --ok:#7DCC9F; --ok-bg:#153226; --warn:#E5C06B; --warn-bg:#382D13; --bad:#EF9B9B; --bad-bg:#3C1C1C; --info-bg:#163246;
  --on-blue:#0B161D; --side:#081A25; --side-ink:#A9C2D3; --side-active:rgba(255,255,255,.08); color-scheme:dark}}
:root[data-theme="dark"]{
  --blue:#62A8D8; --blue-deep:#0A2230; --copper:#E3A57C; --copper-soft:#3B2A1F;
  --bg:#0B161D; --surface:#12212B; --surface-2:#0F1C25; --ink:#E3EDF3; --muted:#93AABB; --line:#23384A;
  --ok:#7DCC9F; --ok-bg:#153226; --warn:#E5C06B; --warn-bg:#382D13; --bad:#EF9B9B; --bad-bg:#3C1C1C; --info-bg:#163246;
  --on-blue:#0B161D; --side:#081A25; --side-ink:#A9C2D3; --side-active:rgba(255,255,255,.08); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--side)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.45rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
a{color:var(--blue)}
.muted{color:var(--muted)} .small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}

/* casca */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:14px 10px calc(14px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;color:#fff;text-decoration:none}
.brand img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.brand b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.08rem;line-height:1.1}
.brand small{font-size:.72rem;color:#E9B48F}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--side-ink);text-decoration:none;font-weight:600;font-size:.95rem}
.nav a svg{width:19px;height:19px;flex:none;opacity:.85}
.nav a:hover{background:var(--side-active);color:#fff}
.nav a[aria-current="page"]{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 #E9B48F}
.nav .badge{margin-left:auto;background:#E9B48F;color:#3A2210;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 7px}
.nav-sep{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#7FA0B6;padding:14px 10px 4px}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:.85rem}
.side-foot button{margin-top:8px}
.main{min-width:0;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar{display:none}
.pagehead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.pagehead .sub{color:var(--muted);font-size:.92rem;margin-top:2px}
@media (max-width:899px){
  .shell{display:block}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:50;transform:translateX(-102%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .shell.open .side{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(5,15,22,.5);z-index:45}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--side);color:#fff;align-items:center;gap:10px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
  .topbar b{font-family:var(--f-display);font-weight:400}
  .topbar button{background:transparent;border:0;color:#fff;padding:8px;border-radius:8px;cursor:pointer}
}

/* componentes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:600 .95rem var(--f-body);padding:9px 15px;border-radius:10px;border:1.5px solid transparent;cursor:pointer;text-decoration:none;min-height:40px;white-space:nowrap;color:var(--ink)}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--blue);color:var(--on-blue)}
.btn-copper{background:var(--copper);color:#fff}
.btn-line{background:var(--surface);border-color:var(--line)}
.btn-line:hover{border-color:var(--blue)}
.btn-danger{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.btn-ghost-light{background:transparent;border-color:rgba(255,255,255,.3);color:#fff}
.btn-sm{padding:5px 10px;min-height:32px;font-size:.86rem;border-radius:8px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--copper);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card > h2,.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:inherit;display:block}
a.kpi:hover{border-color:var(--blue)}
.kpi b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.55rem;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:.84rem;color:var(--muted)}
.kpi.alert{border-color:var(--copper);background:var(--copper-soft)}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:700;white-space:nowrap}
.p-blue{background:var(--info-bg);color:var(--blue)} .p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)}
.p-cop{background:var(--copper-soft);color:var(--copper)} .p-mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.ex{font-size:.66rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:middle;letter-spacing:.04em}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td b{font-weight:600}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input,.toolbar select{width:auto;min-width:0;flex:1 1 180px;max-width:320px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{font:600 .86rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}

/* formulários */
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.9rem;min-width:0}
.f.full{grid-column:1/-1}
.f small{font-weight:400;color:var(--muted)}
.req{color:var(--copper);font-style:normal}
input,select,textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-height:42px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none}
.checks{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));font-weight:400}
.checks label,.consent{display:flex;gap:9px;align-items:flex-start;font-weight:400;cursor:pointer}
.checks input,.consent input{width:18px;height:18px;min-height:0;flex:none;margin-top:3px;accent-color:var(--blue)}
.consent{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.err{color:var(--bad);font-weight:600;font-size:.9rem}
.note{background:var(--info-bg);border-radius:10px;padding:10px 12px;font-size:.9rem}
.note.warn{background:var(--warn-bg)}

dl.kv{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:6px 14px;margin:0}
dl.kv dt{color:var(--muted);font-size:.88rem} dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* escala */
.week{display:grid;gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day.today{border-color:var(--blue)}
.day-h{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:600}
.day.today .day-h{background:var(--info-bg)}
.shift{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:4px solid transparent;font:inherit;color:inherit;text-align:left}
.shift:last-child{border-bottom:0}
.shift:hover{background:var(--surface-2)}
.shift.s-agendado{border-left-color:var(--blue)} .shift.s-realizado{border-left-color:var(--ok)}
.shift.s-falta{border-left-color:var(--bad)} .shift.s-cancelado{border-left-color:var(--line);opacity:.6}
.shift.nopro{border-left-color:var(--copper);background:var(--copper-soft)}
.shift .t{font-variant-numeric:tabular-nums;font-weight:600;font-size:.9rem}
.shift .t small{display:block;font-weight:400;color:var(--muted)}
.shift .w{min-width:0}
.shift .w b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.shift .w span{font-size:.86rem;color:var(--muted)}

.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;gap:12px;padding:8px 0;position:relative}
.timeline li::before{content:"";flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-top:4px;z-index:1}
.timeline li.done::before{background:var(--blue);border-color:var(--blue)}
.timeline li.now::before{background:var(--copper);border-color:var(--copper)}
.timeline li:not(:last-child)::after{content:"";position:absolute;left:6px;top:22px;bottom:-6px;width:2px;background:var(--line)}
.timeline b{display:block;font-weight:600}

.evo{border-left:3px solid var(--blue);padding:6px 0 6px 12px}
.evo + .evo{margin-top:12px}
.vitals{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.vitals span{font-size:.8rem;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}

.contract{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;font-size:.95rem;line-height:1.6;max-height:460px;overflow:auto}
.contract h4{font-size:.98rem;margin:14px 0 4px}
.contract p + p{margin-top:6px}

/* modal */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(5,15,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:640px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:860px}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-b{padding:16px;display:flex;flex-direction:column;gap:14px}
.x{background:none;border:0;font-size:1.5rem;line-height:1;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:90;font-weight:600;max-width:90vw}

/* painel diário */
.welcome{position:relative;overflow:hidden;border-radius:18px;padding:26px 28px;background:linear-gradient(120deg,var(--blue-deep),#1F648D);color:#fff;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between}
.welcome::after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(233,180,143,.35),transparent 70%)}
.welcome h1{font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:600;color:#fff;margin-top:8px}
.welcome p{color:#C9DCE8}
.welcome > *{position:relative;z-index:1}
.eyebrow-pill{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:#E9B48F}
.eyebrow-line{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--copper);border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin-bottom:6px}
.kpi .kl{display:block;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi.k-blue{background:var(--info-bg);border-color:transparent} .kpi.k-blue .kl,.kpi.k-blue b{color:var(--blue)}
.kpi.k-red{background:var(--bad-bg);border-color:transparent} .kpi.k-red .kl,.kpi.k-red b{color:var(--bad)}
.kpi.k-green{background:var(--ok-bg);border-color:transparent} .kpi.k-green .kl,.kpi.k-green b{color:var(--ok)}
.grid3{display:grid;gap:16px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media (max-width:900px){.grid3{grid-template-columns:1fr}}
.donutbox{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:8px;flex:1;min-width:200px}
.legend li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:.9rem}
.legend i{width:12px;height:12px;border-radius:3px}
.busca-side{padding:0 4px 12px} .busca-side input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#fff;min-height:38px;font-size:.9rem}
.busca-side input::placeholder{color:#8FB0C4}
.list-links{display:grid;gap:6px;margin-top:10px}
.list-links a{display:flex;flex-direction:column;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink)}
.list-links a:hover{border-color:var(--blue)} .list-links span{font-size:.86rem;color:var(--muted)}
tfoot td{background:var(--surface-2);border-top:1px solid var(--line)}
.print-head{display:none}
@media print{
  .side,.topbar,.no-print,.toast,.scrim{display:none!important}
  .shell{display:block} .main{padding:0} body{background:#fff;color:#000}
  .card,.tablewrap{border:0;box-shadow:none;padding:0} th{background:#eee!important}
  .print-head{display:flex;gap:12px;align-items:center;margin-bottom:14px} .print-head img{width:48px;height:48px;border-radius:10px}
  .print-head b{display:block;font-size:1.1rem} .print-head span{color:#444}
  .overlay{position:static;background:none;padding:0} .modal{box-shadow:none;border:0;max-width:none} .modal-h .x{display:none}
}
/* documentos */
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.docgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.docslot{position:relative;display:flex;gap:12px;align-items:center;padding:12px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.docslot:hover,.docslot:focus-within{border-color:var(--blue)}
.docslot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.docthumb{flex:none;width:64px;height:64px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:1.4rem;color:var(--muted);overflow:hidden;font-weight:700}
.docthumb img{width:100%;height:100%;object-fit:cover}
.doctext{display:flex;flex-direction:column;gap:2px;min-width:0}
.doctext small{color:var(--muted);font-size:.84rem}
.docslot.ok .docst{color:var(--ok);font-weight:600}
.docview{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.docview figure{margin:0;display:flex;flex-direction:column;gap:6px}
.docview img{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
/* página de links */
.linkpage{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;max-width:460px;margin:0 auto;width:100%}
.linklogo{width:96px;height:96px;border-radius:24px;object-fit:cover;box-shadow:0 8px 24px rgba(15,53,80,.25)}
.linkpage h1{font-weight:400;font-size:1.6rem} .linkpage h1 small{font-size:.9rem;color:var(--copper);letter-spacing:.06em}
.linklist{display:flex;flex-direction:column;gap:10px;width:100%}
.linkbtn{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.linkbtn span{font-size:.86rem;color:var(--muted)}
.linkbtn:hover{border-color:var(--blue)}
.linkbtn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)} .linkbtn.primary span{color:var(--on-blue);opacity:.85}
.linkbtn.copper{background:var(--copper);border-color:var(--copper);color:#fff} .linkbtn.copper span{color:#fff;opacity:.9}
.linkserv{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.linkserv li{font-size:.84rem;background:var(--info-bg);border-radius:999px;padding:4px 10px}
/* telas públicas e login */
.pub{min-height:100vh;display:flex;flex-direction:column}
.pub-top{background:var(--side);color:#fff}
.pub-top .in{max-width:760px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.pub-main{max-width:760px;width:100%;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 50px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:var(--side);color:#fff;padding:40px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art h1{font-weight:300;font-size:clamp(1.8rem,3.4vw,2.6rem);max-width:16ch;color:#fff}
.login-art p{color:#BFD3E1;max-width:40ch;margin-top:12px}
.login-art svg{position:absolute;right:-30px;bottom:-20px;width:420px;opacity:.25}
.login-form{display:flex;align-items:center;justify-content:center;padding:30px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px))}
.login-form form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
@media (max-width:760px){.login{grid-template-columns:1fr}.login-art{padding:28px 20px}.login-art svg{width:260px}}
.wbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wbar i{height:5px;border-radius:3px;background:var(--line)} .wbar i.on{background:var(--blue)}
.okbox{background:var(--ok-bg);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.okbox h2{color:var(--ok)}
.code{font-family:var(--f-display);font-size:1.5rem;letter-spacing:.06em}
.demo-strip{font-size:.82rem;background:var(--copper-soft);color:var(--ink);padding:6px 12px;border-radius:9px}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>

function calcPag(p){
  const base=+p.valorPago||0, pro=Store.get("profissionais",p.profId), r={base,valor:base,horas:null,obs:""};
  if(p.chegada&&p.saida){ const tol=(+(Store.cfg().tolerancia??15)||0)*6e4, a=new Date(p.chegada.em).getTime(), b=new Date(p.saida.em).getTime();
    const ini = a<=tStart(p)+tol ? tStart(p) : a, fimR = b>=tEnd(p)-tol ? tEnd(p) : b;
    r.horas=Math.max(0,Math.min(p.horas,(fimR-ini)/36e5)); }
  if(p.status!=="realizado") { r.valor = p.status==="falta"?0:base; if(p.status==="falta") r.obs="Falta"; return r; }
  if(p.valorAjustado!=null&&p.valorAjustado!==""){ r.valor=+p.valorAjustado; r.obs="Ajustado: "+(p.ajusteMotivo||"pela administração"); return r; }
  if(pro?.porHora==="sim"){
    if(r.horas==null){ r.obs="Sem registro de saída, valor cheio até ajuste"; return r; }
    r.valor=Math.round(base*r.horas/p.horas*100)/100; if(r.valor<base) r.obs=`Por hora: ${r.horas.toFixed(1).replace(".",",")} h de ${p.horas} h`; }
  return r;
}

function field(f, v){
  const id="f_"+f.k, cls="f"+(f.full?" full":"");
  const lab=`${esc(f.l)}${f.req?' <i class="req">*</i>':""}${f.h?`<small>${esc(f.h)}</small>`:""}`;
  if(f.t==="checks") return `<div class="${cls}"><span>${lab}</span><div class="checks">${f.o.map(o=>`<label><input type="checkbox" name="${id}" value="${esc(o)}" ${(v||[]).includes(o)?"checked":""}>${esc(o)}</label>`).join("")}</div></div>`;
  let input;
  if(f.t==="select") input=`<select id="${id}">${f.o.map(o=>{const [val,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(v??f.d??"")===String(val)?"selected":""}>${esc(l)}</option>`}).join("")}</select>`;
  else if(f.t==="textarea") input=`<textarea id="${id}" rows="${f.rows||3}" ${f.ph?`placeholder="${esc(f.ph)}"`:""}>${esc(v??"")}</textarea>`;
  else input=`<input id="${id}" type="${f.t||"text"}" value="${esc(v??f.d??"")}" ${f.ph?`placeholder="${esc(f.ph)}"`:""} ${f.im?`inputmode="${f.im}"`:""} ${f.step?`step="${f.step}"`:""} ${f.ac?`autocomplete="${f.ac}"`:""}>`;
  return `<label class="${cls}">${lab}${input}</label>`;
}

const missing = (spec,o) => { const f=spec.find(f=>f.req && (Array.isArray(o[f.k])?!o[f.k].length:o[f.k]===""||o[f.k]==null)); return f?`Preencha o campo "${f.l}".`:""; };

function modal(title, body, opts={}){

}

function statusDia(p){ if(p.status==="realizado") return "concluido"; if(p.status==="andamento") return "andamento"; if(p.status==="falta") return "falta";
  return Date.now()>tStart(p)+15*6e4 ? "atrasado" : "nao"; }
const ST_DIA = {nao:["Não iniciados","var(--blue)"],atrasado:["Atrasados","var(--bad)"],andamento:["Em andamento","var(--copper)"],concluido:["Concluídos","var(--ok)"],falta:["Faltas","var(--muted)"]};
function donut(parts, centro, legenda){
  const tot=parts.reduce((a,x)=>a+x.v,0), R=52, C=2*Math.PI*R; let off=0;
  const segs = tot ? parts.filter(x=>x.v>0).map(x=>{ const len=C*x.v/tot; const el=`<circle r="${R}" cx="70" cy="70" fill="none" style="stroke:${x.c}" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"/>`; off+=len; return el; }).join("") : "";
  return `<svg viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="${esc(legenda)}"><circle r="${R}" cx="70" cy="70" fill="none" style="stroke:var(--line)" stroke-width="18"/>${segs}<text x="70" y="70" text-anchor="middle" style="fill:var(--ink);font:500 18px var(--f-display)">${centro}</text><text x="70" y="88" text-anchor="middle" style="fill:var(--muted);font:10px var(--f-body)">${legenda}</text></svg>`;

/* =================== RELATÓRIOS =================== */
let rel={tipo:"atendimentos",de:null,ate:null,pac:"",pro:""};
const REL_TIPOS=[["atendimentos","Atendimentos por período"],["presenca","Presença e pontualidade"],["produtividade","Produtividade por profissional"],["pacientes","Resumo por paciente"],["prontuario","Prontuário (evoluções do paciente)"],["estoque","Consumo de materiais"],["financeiro","Financeiro por mês"]];
function pgRelatorios(){
  if(!rel.de){ rel.de=today().slice(0,8)+"01"; rel.ate=today(); }
  const pls=Store.all("plantoes").filter(p=>p.data>=rel.de&&p.data<=rel.ate&&(!rel.pac||p.pacId===rel.pac)&&(!rel.pro||p.profId===rel.pro)).sort((a,b)=>tStart(a)-tStart(b));
  let head=[], rows=[], foot=null, nota="";

  if(rel.tipo==="atendimentos"){ head=["Data","Horário","Paciente","Profissional","Modalidade","Situação","Chegada","Saída","Valor cobrado"];
    rows=pls.map(p=>[fmtDay(p.data),`${p.inicio}–${fim(p)}`,pacName(p.pacId),proName(p.profId),MOD_NAME[p.mod],PL_ST[p.status][0],p.chegada?hhmm(p.chegada.em):"-",p.saida?hhmm(p.saida.em):"-",brl(p.valorCobrado)]);
    foot=["Total",`${pls.length} atendimentos`,"","","","","","",brl(pls.filter(p=>p.status!=="cancelado").reduce((a,p)=>a+(+p.valorCobrado||0),0))]; }
  if(rel.tipo==="presenca"||rel.tipo==="produtividade"){
    const by={}; pls.filter(p=>p.profId&&p.status!=="cancelado"&&tStart(p)<Date.now()).forEach(p=>(by[p.profId]=by[p.profId]||[]).push(p));
    if(rel.tipo==="presenca"){ head=["Profissional","Plantões","Com chegada","Atrasos (>15 min)","Atraso médio","Fora do endereço","Sem saída","Faltas","Lançados pela adm."];
      rows=Object.entries(by).map(([id,l])=>{ const ch=l.filter(p=>p.chegada), at=ch.map(atrasoMin).filter(x=>x>15), fora=l.filter(p=>regInfo(p.chegada,Store.get("pacientes",p.pacId))?.longe||regInfo(p.saida,Store.get("pacientes",p.pacId))?.longe).length;
        return [proName(id),l.length,ch.length,at.length,at.length?Math.round(at.reduce((a,x)=>a+x,0)/at.length)+" min":"-",fora,l.filter(p=>p.chegada&&!p.saida&&p.status==="realizado").length,l.filter(p=>p.status==="falta").length,l.filter(p=>p.chegada?.manual||p.saida?.manual).length]; }); }
    else { head=["Profissional","Função","Plantões realizados","Horas previstas","Horas registradas","Valor a pagar","Faltas"];
      rows=Object.entries(by).map(([id,l])=>{ const r=l.filter(p=>p.status==="realizado"), cs=r.map(calcPag); return [proName(id),Store.get("profissionais",id)?.funcao||"",r.length,r.reduce((a,p)=>a+p.horas,0),h1(cs.reduce((a,c)=>a+(c.horas??0),0)),brl(cs.reduce((a,c)=>a+c.valor,0)),l.filter(p=>p.status==="falta").length]; }); } }
  if(rel.tipo==="pacientes"){ head=["Paciente","Atendimento","Plantões realizados","Horas","Evoluções","Faltas","Faturado"];
    const by={}; pls.forEach(p=>(by[p.pacId]=by[p.pacId]||[]).push(p));
    rows=Object.entries(by).map(([id,l])=>{ const pac=Store.get("pacientes",id), r=l.filter(p=>p.status==="realizado"); return [pacName(id),pac?.tipo==="operadora"?(Store.get("operadoras",pac.operadoraId)?.nome||"Operadora"):"Particular",r.length,r.reduce((a,p)=>a+p.horas,0),l.filter(p=>p.evolucao).length,l.filter(p=>p.status==="falta").length,brl(r.reduce((a,p)=>a+(+p.valorCobrado||0),0))]; }); }
  if(rel.tipo==="prontuario"){ head=["Data","Horário","Profissional","Sinais vitais","Evolução"];
    if(!rel.pac) nota="Escolha um paciente para ver o prontuário.";
    rows=rel.pac?pls.filter(p=>p.evolucao).map(p=>{ const e=p.evolucao; return [fmtDay(p.data),`${p.chegada?hhmm(p.chegada.em):p.inicio}–${p.saida?hhmm(p.saida.em):fim(p)}`,proName(e.por||p.profId),[e.pa&&"PA "+e.pa,e.fc&&"FC "+e.fc,e.temp&&e.temp+"°C",e.sat&&"SpO₂ "+e.sat+"%",e.glic&&"Glic "+e.glic].filter(Boolean).join(" · "),e.texto]; }):[]; }
  if(rel.tipo==="estoque"){ head=["Data","Produto","Quantidade","Paciente","Custo"];
    const ms=Store.all("movEstoque").filter(m=>m.tipo==="saida"&&m.data>=rel.de&&m.data<=rel.ate&&(!rel.pac||m.pacId===rel.pac)).sort((a,b)=>a.data.localeCompare(b.data));
    rows=ms.map(m=>{ const pr=Store.get("produtos",m.prodId); return [fmtDay(m.data),pr?.nome||"-",`${m.qtd} ${pr?.unidade||""}`,m.pacId?pacName(m.pacId):"-",brl((+pr?.custo||0)*m.qtd)]; });
    foot=["Total","","","",brl(ms.reduce((a,m)=>a+(+Store.get("produtos",m.prodId)?.custo||0)*m.qtd,0))]; }
  if(rel.tipo==="financeiro"){ head=["Mês","Plantões","Faturado","Recebido","Custo profissionais","Margem"];
    const by={}; pls.filter(p=>p.status==="realizado").forEach(p=>(by[p.data.slice(0,7)]=by[p.data.slice(0,7)]||[]).push(p));
    rows=Object.entries(by).sort().map(([m,l])=>{ const f=l.reduce((a,p)=>a+(+p.valorCobrado||0),0), c=l.reduce((a,p)=>a+valorProf(p),0); return [mesLabel(m),l.length,brl(f),brl(l.filter(p=>p.recebido).reduce((a,p)=>a+(+p.valorCobrado||0),0)),brl(c),brl(f-c)]; }); }
  CSV_ROWS=[head,...rows,...(foot?[foot]:[])];
  const titulo=REL_TIPOS.find(x=>x[0]===rel.tipo)[1];
  return `<div class="pagehead no-print"><div><h1>Relatórios</h1><p class="sub">Escolha o relatório e o período</p></div>${exportBar("relatorio-"+rel.tipo)}</div>
  <section class="card no-print"><div class="fgrid">
    <label class="f">Relatório<select id="rel_tipo">${REL_TIPOS.map(([k,l])=>`<option value="${k}" ${rel.tipo===k?"selected":""}>${l}</option>`).join("")}</select></label>
    <label class="f">De<input id="rel_de" type="date" value="${rel.de}"></label><label class="f">Até<input id="rel_ate" type="date" value="${rel.ate}"></label>
    <label class="f">Paciente<select id="rel_pac"><option value="">Todos</option>${Store.all("pacientes").map(p=>`<option value="${p.id}" ${rel.pac===p.id?"selected":""}>${esc(p.nome||p.responsavel)}</option>`).join("")}</select></label>
    <label class="f">Profissional<select id="rel_pro"><option value="">Todos</option>${Store.all("profissionais").map(p=>`<option value="${p.id}" ${rel.pro===p.id?"selected":""}>${esc(p.nome)}</option>`).join("")}</select></label></div></section>
  <section class="card"><div class="print-head"><img src="${LOGO}" alt=""><div><b>${esc(Store.cfg().nome||"Viver Bem Atendimento Domiciliar")}</b><span>${titulo} · ${fmtDay(rel.de)} a ${fmtDay(rel.ate)}${rel.pac?" · "+esc(pacName(rel.pac)):""}${rel.pro?" · "+esc(proName(rel.pro)):""}</span></div></div>
    <h2 class="no-print" style="margin-bottom:10px">${titulo}</h2>
    ${nota?`<p class="empty">${nota}</p>`:`<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${head.length}" class="empty">Nada no período.</td></tr>`}</tbody>${foot?`<tfoot><tr>${foot.map(v=>`<td><b>${esc(v)}</b></td>`).join("")}</tr></tfoot>`:""}</table></div>`}
    <p class="small muted" style="margin-top:10px">Gerado em ${fmtDT(new Date().toISOString())} por ${esc(S.nome)}</p></section>`;
}

/* =================== CHEGADAS E SAÍDAS =================== */
let pontoIni=null, pontoOc=false, pontoPro="";
function pgPonto(){
  if(!pontoIni) pontoIni=weekStart(today());
  const ate=addDays(pontoIni,6), now=Date.now();
  const rows=Store.all("plantoes").filter(p=>p.data>=pontoIni&&p.data<=ate&&p.status!=="cancelado"&&tStart(p)<=now&&(!pontoPro||p.profId===pontoPro)).sort((a,b)=>tStart(b)-tStart(a)).map(p=>{
    const pac=Store.get("pacientes",p.pacId), ch=regInfo(p.chegada,pac), sa=regInfo(p.saida,pac), at=atrasoMin(p), oc=[];
    if(p.status==="falta") oc.push(["Falta","p-bad"]);
    else if(!p.chegada) oc.push([tStart(p)<now-30*6e4?"Não registrou chegada":"Aguardando chegada",tStart(p)<now-30*6e4?"p-bad":"p-blue"]);
    if(at>15) oc.push([`Atraso ${at} min`,"p-warn"]);
    if(ch?.longe||sa?.longe) oc.push(["Fora do endereço","p-bad"]);
    if(p.chegada&&!p.saida&&tEnd(p)<now-36e5) oc.push(["Sem registro de saída","p-warn"]);
    if(ch?.semGeo||sa?.semGeo) oc.push(["Sem localização","p-mute"]);
    return {p,pac,ch,sa,at,oc,h:p.chegada&&p.saida?(new Date(p.saida.em)-new Date(p.chegada.em))/36e5:null}; });
  const comCh=rows.filter(r=>r.p.chegada), pont=comCh.filter(r=>r.at<=15).length;
  const list=pontoOc?rows.filter(r=>r.oc.length&&!(r.oc.length===1&&r.oc[0][0]==="Aguardando chegada")):rows;
  const cell=(r,raw)=> r?`<b class="num">${r.hora}</b><div class="small">${r.semGeo?'<span class="muted">sem localização</span>':r.d==null?'<span class="muted">casa sem localização</span>':`<span style="color:var(${r.longe?"--bad":"--ok"})">${r.longe?"a "+fmtDist(r.d):"no endereço"}</span>`}${r.map?` · <a href="${r.map}" target="_blank" rel="noopener">mapa</a>`:""}</div>`:'<span class="muted">-</span>';
  return `<div class="pagehead"><div><h1>Chegadas e saídas</h1><p class="sub">${fmtDay(pontoIni)} a ${fmtDay(ate)} · registros feitos pelo celular dos profissionais, com horário e localização</p></div>
    <div class="actions"><button class="btn btn-line btn-sm" data-act="pontoSem" data-id="-7">‹ Anterior</button><button class="btn btn-line btn-sm" data-act="pontoSem" data-id="0">Esta semana</button><button class="btn btn-line btn-sm" data-act="pontoSem" data-id="7">Próxima ›</button></div></div>
  <div class="kpis">
    <div class="kpi"><b>${rows.filter(r=>r.p.status==="andamento").length}</b><span>Em atendimento agora</span></div>
    <div class="kpi"><b>${comCh.length?Math.round(pont/comCh.length*100):0}%</b><span>Chegadas no horário (até 15 min)</span></div>
    <div class="kpi ${rows.some(r=>r.at>15)?"alert":""}"><b>${rows.filter(r=>r.at>15).length}</b><span>Atrasos</span></div>
    <div class="kpi"><b>${rows.filter(r=>r.oc.some(o=>o[0]==="Não registrou chegada"||o[0]==="Falta")).length}</b><span>Sem chegada ou falta</span></div>

function wzRead(){ const d=wz.d; if(wz.step===1) Object.assign(d,readFields(W1)); if(wz.step===2) Object.assign(d,readFields(W2())); if(wz.step===3) d.resumo=$("#f_resumo")?.value.trim()||""; }
function wzCheck(){
  const d=wz.d, s=wz.step;
  if(s===1){ const m=missing(W1,d); if(m) return m; if(d.nome.split(" ").filter(Boolean).length<2) return "Informe seu nome completo."; if(!validDoc(d.cpf)) return "CPF ou CNPJ inválido. Confira os números."; d.cpf=digits(d.cpf); if(digits(d.tel).length<10) return "Informe o WhatsApp com DDD."; if(!/.+@.+\..+/.test(d.email)) return "Informe um e-mail válido."; }
  if(s===2){ const m=missing(W2(),d); if(m) return m; if(!/\d{3,}/.test(d.registro)) return `Informe o número de inscrição no ${FUNCOES[d.funcao]||"conselho"}.`; }
  if(s===3){ const f=DOCS.find(([k])=>!(d.docs||{})[k]); if(f) return `Envie: ${f[1]}.`; }
  return "";
}

function docSlot([k,l,h]){ const d=(wz.d.docs||{})[k], img=wz._docs?.[k];
  return `<label class="docslot ${d?"ok":""}" for="doc_${k}"><span class="docthumb">${img&&img.startsWith("data:image")?`<img src="${img}" alt="">`:d?"PDF":k==="selfie"?"🙂":"+"}</span><span class="doctext"><b>${l} <i class="req">*</i></b><small>${h}</small><small class="docst">${d?`Enviado: ${esc(d.nome)} (${d.kb} KB) · toque para trocar`:"Toque para enviar"}</small></span>
    <input id="doc_${k}" data-doc="${k}" type="file" accept="${k==="curriculo"?".pdf,.doc,.docx,image/*":k==="endereco"?"image/*,.pdf":"image/*"}" ${k==="selfie"?'capture="user"':""} class="sr"></label>`; }
async function docInput(input, store, onDone){ const file=input.files[0]; if(!file) return; const k=input.dataset.doc;
  try{ const data=await prepFile(file); store.data[k]=data; store.meta[k]={nome:file.name,kb:Math.max(1,Math.round(data.length*0.75/1024)),em:new Date().toISOString()}; onDone(); }
  catch(err){ input.value=""; toast(err.message); } }
/* currículo: fotos são reduzidas; PDF/Word até 700 KB (cabe num documento do banco) */
function prepFile(file){
  return new Promise((ok,ko)=>{
    const rd=new FileReader(); rd.onerror=()=>ko(new Error("Não foi possível ler o arquivo."));
    if(file.type.startsWith("image/")){
      rd.onload=()=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,1400/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); ok(c.toDataURL("image/jpeg",0.72)); }; img.onerror=()=>ko(new Error("Imagem inválida.")); img.src=rd.result; };
    } else {
      if(!/pdf|word|document|msword/.test(file.type)&&!/\.(pdf|docx?)$/i.test(file.name)) return ko(new Error("Formato não aceito. Envie foto, PDF ou Word."));
      if(file.size>700*1024) return ko(new Error("Arquivo maior que 700 KB. Envie um PDF menor ou uma foto."));
      rd.onload=()=>ok(rd.result);
    }
    rd.readAsDataURL(file);
  });
}

function bindPublic(r){
  if(r==="trabalhe"){ const f=$("#fWz"); if(!f) return;
    $$("input[data-doc]",f).forEach(inp=>inp.onchange=()=>{ wz._docs=wz._docs||{}; wz.d.docs=wz.d.docs||{};
      docInput(inp,{data:wz._docs,meta:wz.d.docs},()=>{ const sl=inp.closest(".docslot"); sl.outerHTML=docSlot(DOCS.find(x=>x[0]===inp.dataset.doc)); bindPublic("trabalhe"); }); });
    f.onsubmit=async e=>{ e.preventDefault(); wzRead(); const m=wzCheck(); if(m) return showErr(f,m);
      if(wz.step<4){ wz.step++; render(); return; }
      if(!["a1","a2","a3"].every(id=>$("#"+id).checked)) return showErr(f,"Marque os três termos para enviar.");
      const btn=$("button:last-of-type",f); btn.disabled=true;
      try{
        if(Store.mode==="demo" && Store.all("candidatos").some(c=>c.cpf===wz.d.cpf&&!c.exemplo)) { btn.disabled=false; return showErr(f,"Já existe uma candidatura com este CPF. Use Acompanhar candidatura."); }
        const now=new Date().toISOString(), id="VB-"+Math.random().toString(36).slice(2,8).toUpperCase();
        btn.textContent="Enviando documentos...";
        for(const [k] of DOCS){ await Store.put("documentos",{id:`${id}_${k}`,cand:id,tipo:k,nome:wz.d.docs[k].nome,data:wz._docs[k]}); }
        await Store.put("candidatos",{...wz.d,id,status:"recebido",hist:[{s:"recebido",em:now}],aceites:now,notas:""});
        wz={step:5,d:{exp:[],disp:[]},done:id}; render(); window.scrollTo(0,0);
      }catch(err){ btn.disabled=false; showErr(f,"Não foi possível enviar agora. Verifique a internet e tente de novo."); }
    };
  }
  if(r==="acompanhar"){ $$("#fRe input[data-doc]").forEach(inp=>inp.onchange=()=>docInput(inp,acompDocs,render)); }
  if(r==="acompanhar"){ const f=$("#fAc"); if(f) f.onsubmit=async e=>{ e.preventDefault(); const cpf=digits($("#f_cpf").value), id=$("#f_proto").value.trim().toUpperCase();
    const c=id?await Store.fetchOne("candidatos",id):null; if(!c||c.cpf!==cpf) return showErr(f,"Não encontramos candidatura com esse CPF e protocolo. Confira os dados.");
    acomp={c, ct:c.contratoId?await Store.fetchOne("contratos",c.contratoId):null}; render(); }; }
  if(r==="assinar"){ const f=$("#fSign"); if(f) f.onsubmit=async e=>{ e.preventDefault(); const c=window._ct, nome=$("#f_sNome").value.trim(), cpf=digits($("#f_sCpf").value);

    if(norm(nome)!==norm(espNome)) return showErr(f,`O nome precisa ser igual ao do contrato: ${espNome}.`);
    if(espCpf && cpf!==espCpf) return showErr(f,`O ${docLabel(espCpf)} não confere com o do contrato.`);
    if(!validDoc(cpf)) return showErr(f,"CPF ou CNPJ inválido.");

    try{ await Store.put("contratos",c); toast("Contrato assinado"); render(); }catch(err){ showErr(f,"Não foi possível assinar agora. Tente de novo."); } }; }

  async delContrato(id,b){ if(b.dataset.ok!=="1"){ b.dataset.ok="1"; b.textContent="Confirmar exclusão"; return; } const c=Store.get("contratos",id); const cand=Store.all("candidatos").find(x=>x.contratoId===id); if(cand){ delete cand.contratoId; await Store.put("candidatos",cand); } await Store.del("contratos",id); closeModal(); toast("Contrato excluído"); render(); },

    else { render(); formOp(null,{nome:s.empresa,cnpj:s.cnpj,contato:s.nome,tel:s.tel,email:s.email,obs:s.msg}); } },

  async delOp(id,b){ if(b.dataset.ok!=="1"){ b.dataset.ok="1"; b.textContent="Confirmar exclusão"; return; } if(Store.all("pacientes").some(p=>p.operadoraId===id)) return showErr($(".modal-b"),"Há pacientes ligados a esta operadora. Marque como Inativa."); await Store.del("operadoras",id); closeModal(); render(); },
  async finRec(k){ const [t,id]=k.split(":"); for(const p of Store.all("plantoes").filter(p=>p.data.startsWith(finMes)&&p.status==="realizado"&&!p.recebido)){ const pac=Store.get("pacientes",p.pacId); const key=pac?.tipo==="operadora"&&pac.operadoraId?"op:"+pac.operadoraId:"pac:"+p.pacId; if(key===k){ p.recebido=true; await Store.put("plantoes",p); } } toast("Marcado como recebido"); render(); },
  async finPag(id){ for(const p of Store.all("plantoes").filter(p=>p.data.startsWith(finMes)&&p.status==="realizado"&&!p.pago&&p.profId===id)){ p.pago=true; await Store.put("plantoes",p); } toast("Marcado como pago"); render(); },
  async saveCfg(){ const c=Store.cfg(); const v=readFields([{k:"nome"},{k:"cnpj"},{k:"cidade"},{k:"endereco"},{k:"whatsapp"},{k:"email"},{k:"instagram"},{k:"diaPagamento"},{k:"modeloAutonomo"},{k:"modeloPaciente"},{k:"dpo"},{k:"raio"},{k:"tolerancia"},...ADDR("e_",false)]);

document.addEventListener("click", e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const fn=ACT[b.dataset.act]; if(!fn) return;
  if(b.tagName==="BUTTON"||b.tagName==="TR"||b.getAttribute("href")==="#") e.preventDefault();
  if(b.dataset.act==="close" && b.tagName==="A") { closeModal(); return; }
  Promise.resolve(fn(b.dataset.id,b,e)).catch(err=>{ console.error(err); toast("Algo deu errado: "+(err.message||err)); });
});
document.addEventListener("input", e=>{
  if(e.target.id==="pacBusca"){ pacBusca=e.target.value; const pos=e.target.selectionStart; render().then(()=>{ const i=$("#pacBusca"); i.focus(); i.setSelectionRange(pos,pos); }); }
  if(e.target.id==="audBusca"){ audBusca=e.target.value; const pos=e.target.selectionStart; render().then(()=>{ const i=$("#audBusca"); i.focus(); i.setSelectionRange(pos,pos); }); }
  if(e.target.id==="proBusca"){ proBusca=e.target.value; const pos=e.target.selectionStart; render().then(()=>{ const i=$("#proBusca"); i.focus(); i.setSelectionRange(pos,pos); }); }
});
document.addEventListener("input", e=>{
  const id=e.target.id||""; if(!/^f_(.*)cep$/.test(id)) return;
  const d=digits(e.target.value).slice(0,8); e.target.value=d.length>5?d.slice(0,5)+"-"+d.slice(5):d;
  if(d.length===8) buscaCep(e.target);
});
document.addEventListener("focusout", e=>{
  const id=e.target.id||""; if(/^f_(cpf|cpfResp|respCpf|sCpf)$/.test(id)){ const d=digits(e.target.value); if(d.length===11||d.length===14) e.target.value=fmtCPF(d); }
});
async function buscaCep(input){
  const pre=input.id.slice(2,-3), root=input.closest(".modal-b,form,section,.card")||document, d=digits(input.value);
  if(input.dataset.last===d) return; input.dataset.last=d;
  const set=(k,v)=>{ const el=$("#f_"+pre+k,root)||$("#f_"+pre+k); if(el&&v) el.value=v; };
  try{ const r=await (await fetch(`https://viacep.com.br/ws/${d}/json/`)).json(); if(r.erro) return toast("CEP não encontrado. Preencha o endereço manualmente.");
    set("rua",r.logradouro); set("bairro",r.bairro); set("cidade",r.localidade); set("uf",r.uf); if(r.complemento) set("complemento",r.complemento);
    ($("#f_"+pre+"numero",root)||$("#f_"+pre+"numero"))?.focus(); }
  catch(_){ /* sem internet ou bloqueado: preenchimento manual */ }
}
document.addEventListener("submit", e=>{ if(e.target.id==="fBusca"){ e.preventDefault(); buscaTxt=$("#buscaGeral").value.trim(); if(location.hash==="#busca") render(); else location.hash="busca"; } });
document.addEventListener("change", e=>{
  if(/^rel_/.test(e.target.id||"")){ rel={tipo:$("#rel_tipo").value,de:$("#rel_de").value||rel.de,ate:$("#rel_ate").value||rel.ate,pac:$("#rel_pac").value,pro:$("#rel_pro").value}; render(); }
  if(e.target.id==="escPac"){ escPac=e.target.value; render(); }
  if(e.target.id==="escPro"){ escPro=e.target.value; render(); }
  if(e.target.id==="pontoPro"){ pontoPro=e.target.value; render(); }
});

  }catch(err){ $("#root").innerHTML=`<p class="empty" style="padding-top:30vh">${esc(err.message)}</p>`; return; }
  render();
})();
